name: ASR benchmark

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "Optional direct audio URL; when set it is benchmarked in addition to the three preset podcasts"
        required: false
        default: ""
        type: string
      start_seconds:
        description: "Clip start in seconds"
        required: false
        default: "0"
        type: string
      duration_seconds:
        description: "Clip duration in seconds (900 = 15 min)"
        required: false
        default: "900"
        type: string

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Resolve latest preset episodes and make shared clips
        env:
          CUSTOM_AUDIO_URL: ${{ inputs.audio_url }}
          START_SECONDS: ${{ inputs.start_seconds }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts")
          from feeds import download, parse_rss

          sources = [
              ("opp", "Official PlayStation Podcast", "https://playstation.libsyn.com/rss"),
              ("ignuk", "IGN UK Podcast", "https://rss.pdrl.fm/6213a6/feeds.megaphone.fm/ignukpod"),
              ("nvc", "Nintendo Voice Chat", "https://rss.pdrl.fm/52ee62/feeds.megaphone.fm/nvc"),
          ]
          os.makedirs("benchmark-input", exist_ok=True)
          manifest = []
          for sid, name, rss in sources:
              items = parse_rss(download(rss), sid, name, rss)
              ep = next((x for x in items if x.get("audio_url") and not x.get("video")), None)
              if not ep:
                  raise SystemExit(f"{sid}: no playable episode in RSS")
              manifest.append({
                  "source": sid, "show": name, "title": ep.get("title") or "",
                  "audio_url": ep["audio_url"], "rss": rss,
              })

          custom = os.environ.get("CUSTOM_AUDIO_URL", "").strip()
          if custom:
              manifest.append({
                  "source": "custom", "show": "Custom audio", "title": "Custom audio",
                  "audio_url": custom, "rss": "",
              })

          start = os.environ["START_SECONDS"]
          duration = os.environ["DURATION_SECONDS"]
          for item in manifest:
              sid = item["source"]
              raw = f"benchmark-input/{sid}.source"
              out = f"benchmark-input/{sid}.mp3"
              print(f'{sid}: {item["title"]} -> {item["audio_url"]}', flush=True)
              subprocess.run([
                  "curl", "-L", "--fail", "--retry", "3", "--connect-timeout", "30",
                  "-A", "Mozilla/5.0", item["audio_url"], "-o", raw,
              ], check=True)
              subprocess.run([
                  "ffmpeg", "-y", "-loglevel", "error",
                  "-ss", start, "-t", duration, "-i", raw,
                  "-vn", "-ac", "1", "-ar", "44100", "-c:a", "libmp3lame", "-q:a", "2", out,
              ], check=True)
              os.remove(raw)
          with open("benchmark-input/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          cat benchmark-input/manifest.json
          for f in benchmark-input/*.mp3; do
            ffprobe -v error -show_entries format=duration,size -of json "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: asr-benchmark-input
          path: benchmark-input/
          retention-days: 3
          if-no-files-found: error

  warm-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: asr-large-v3-turbo-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Download/verify faster-whisper model
        run: |
          pip install faster-whisper
          python - <<'PY'
          from faster_whisper import WhisperModel
          WhisperModel("large-v3-turbo", device="cpu", compute_type="float32", cpu_threads=1)
          print("large-v3-turbo ready")
          PY

  benchmark:
    needs: [prepare, warm-model]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        source: [opp, ignuk, nvc, custom]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: asr-large-v3-turbo-${{ runner.os }}-${{ runner.arch }}-v1
      - uses: actions/download-artifact@v4
        with:
          name: asr-benchmark-input
          path: benchmark-input
      - name: Install benchmark dependencies
        if: ${{ matrix.source != 'custom' || inputs.audio_url != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg time
          pip install faster-whisper numpy
          python -m py_compile scripts/asr_benchmark.py
      - name: Run all configs on the same runner
        if: ${{ matrix.source != 'custom' || inputs.audio_url != '' }}
        shell: bash
        run: |
          set +e
          failures=0
          monitor_resources() {
            log="$1"
            printf "ts\tmem_available_kb\tcgroup_current_bytes\tcgroup_max_bytes\toom\toom_kill\tpython_rss_kb\tpython_cpu_pct\n" > "$log"
            while true; do
              ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              mem_avail="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
              cg_current="$(cat /sys/fs/cgroup/memory.current 2>/dev/null || cat /sys/fs/cgroup/memory/memory.usage_in_bytes 2>/dev/null || echo 0)"
              cg_max="$(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo 0)"
              if [ -r /sys/fs/cgroup/memory.events ]; then
                oom="$(awk '$1=="oom" {print $2}' /sys/fs/cgroup/memory.events)"
                oom_kill="$(awk '$1=="oom_kill" {print $2}' /sys/fs/cgroup/memory.events)"
              else
                oom=0
                oom_kill=0
              fi
              py_stats="$(ps -eo comm=,rss=,pcpu= | awk '$1 ~ /^python/ {rss+=$2; cpu+=$3} END {printf "%d %.1f", rss, cpu}')"
              py_rss="${py_stats%% *}"
              py_cpu="${py_stats#* }"
              printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n" \
                "$ts" "${mem_avail:-0}" "${cg_current:-0}" "${cg_max:-0}" \
                "${oom:-0}" "${oom_kill:-0}" "${py_rss:-0}" "${py_cpu:-0}" | tee -a "$log"
              sleep 5
            done
          }

          run_one() {
            config="$1"
            jobs="$2"
            threads="$3"
            schedule="$4"
            out="benchmark/${{ matrix.source }}/$config"
            mkdir -p "$out"
            echo "::group::${{ matrix.source }} / $config"
            monitor_resources "$out/resources.tsv" &
            monitor_pid=$!
            /usr/bin/time -v -o "$out/time.txt" \
              python scripts/asr_benchmark.py "benchmark-input/${{ matrix.source }}.mp3" \
                --workdir "$out/work" \
                --result "$out/result.json" \
                --label "$config" \
                --source "${{ matrix.source }}" \
                --jobs "$jobs" --threads "$threads" --schedule "$schedule"
            rc=$?
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            echo "--- final resource sample ---"
            tail -n 2 "$out/resources.tsv" || true
            if [ -r /sys/fs/cgroup/memory.events ]; then
              echo "--- cgroup memory.events ---"
              cat /sys/fs/cgroup/memory.events || true
            fi
            test ! -f "$out/result.json" || cat "$out/result.json"
            test ! -f "$out/time.txt" || cat "$out/time.txt"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::${{ matrix.source }} / $config failed with exit code $rc"
              failures=$((failures + 1))
            fi
          }

          # Paired benchmark: all configs below execute sequentially on this exact VM.
          run_one 2x2-static 2 2 static
          run_one 4x1-dynamic 4 1 dynamic
          run_one 5x1-dynamic 5 1 dynamic

          if [ "$failures" -ne 0 ]; then
            echo "$failures benchmark configuration(s) failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (matrix.source != 'custom' || inputs.audio_url != '') }}
        with:
          name: asr-bench-${{ matrix.source }}
          path: benchmark/${{ matrix.source }}/
          retention-days: 7
          if-no-files-found: warn

  summary:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: asr-bench-*
          path: results
      - name: Build comparison tables
        run: |
          python - <<'PY'
          import glob, json, os, re, statistics

          configs = ["2x2-static", "4x1-dynamic", "5x1-dynamic"]
          source_order = ["opp", "ignuk", "nvc", "custom"]

          def time_stats(path):
              out = {"cpu": "", "rss_kb": 0}
              if not os.path.exists(path):
                  return out
              text = open(path, encoding="utf-8", errors="replace").read()
              m = re.search(r"Percent of CPU this job got:\s*(\S+)", text)
              if m: out["cpu"] = m.group(1)
              m = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", text)
              if m: out["rss_kb"] = int(m.group(1))
              return out

          rows = []
          for p in glob.glob("results/**/result.json", recursive=True):
              r = json.load(open(p, encoding="utf-8"))
              r.update(time_stats(os.path.join(os.path.dirname(p), "time.txt")))
              rows.append(r)

          rows.sort(key=lambda r: (
              source_order.index(r["source"]) if r["source"] in source_order else 99,
              configs.index(r["label"]) if r["label"] in configs else 99,
          ))
          sources = [s for s in source_order if any(r["source"] == s for r in rows)]
          lookup = {(r["source"], r["label"]): r for r in rows}

          lines = [
              "# ASR multi-source benchmark", "",
              "| source | config | elapsed | RTF | CPU | max RSS |",
              "|---|---|---:|---:|---:|---:|",
          ]
          for r in rows:
              rss = f'{r["rss_kb"] / 1024:.0f} MiB' if r.get("rss_kb") else ""
              lines.append(
                  f'| {r["source"]} | {r["label"]} | {r["elapsed_seconds"]:.1f}s | '
                  f'{r["realtime_factor"]:.3f} | {r.get("cpu", "")} | {rss} |'
              )

          lines += ["", "## Cross-source comparison", ""]
          header = "| config | " + " | ".join(f"{s} RTF" for s in sources) + " | mean RTF | vs 2x2 static |"
          lines += [header, "|" + "---|" * (len(sources) + 3)]
          complete_sources = [
              s for s in sources
              if all((s, cfg) in lookup for cfg in configs)
          ]
          means = {}
          for cfg in configs:
              vals = [lookup[(s, cfg)]["realtime_factor"] for s in complete_sources]
              means[cfg] = statistics.mean(vals) if vals else None
          baseline = means.get("2x2-static")
          for cfg in configs:
              vals = []
              for s in sources:
                  r = lookup.get((s, cfg))
                  vals.append(f'{r["realtime_factor"]:.3f}' if r else "—")
              mean = means[cfg]
              speedup = ((baseline / mean - 1) * 100) if baseline and mean else None
              speed = f"{speedup:+.1f}%" if speedup is not None else "—"
              mean_text = f"{mean:.3f}" if mean is not None else "—"
              lines.append(f'| {cfg} | ' + " | ".join(vals) + f' | {mean_text} | {speed} |')

          complete = [(cfg, means[cfg]) for cfg in configs if means[cfg] is not None]
          if complete:
              best = min(complete, key=lambda x: x[1])
              lines += ["", f'Lowest mean RTF: **{best[0]}** ({best[1]:.3f}).']

          lines += [
              "", "Notes:",
              "- Presets automatically use the latest playable RSS episode from PlayStation, IGN UK, and Nintendo Voice Chat.",
              "- Each source clip is created once and reused by all configurations.",
              "- Default clip length is 15 minutes; custom audio_url adds a fourth source.",
              "- For each source, 2x2-static, 4x1-dynamic and 5x1-dynamic run sequentially on the same hosted runner.",
              "- Aggregate mean RTF uses only sources that completed all three configs, so comparisons stay paired.",
              "- 2x2-static is the production baseline; 4x1-dynamic and 5x1-dynamic are candidate configurations.",
              "- Audio download, clipping, WAV conversion and chunk creation are outside the transcription timer.",
          ]
          text = "\n".join(lines) + "\n"
          print(text)
          open("benchmark-summary.md", "w", encoding="utf-8").write(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asr-benchmark-summary
          path: benchmark-summary.md
          retention-days: 7
