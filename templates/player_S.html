<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var CFG=JSON.parse($('cfg').textContent);
var KEY=CFG.key||'podcast_player';
var st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var cues=JSON.parse($('cues').textContent), chaps=JSON.parse($('chapters').textContent), UI=CFG.ui||{};
function U(k,n){return String(UI[k]==null?k:UI[k]).replace('{n}',n)}
var starts=cues.map(function(c){return c.s});
var au=$('au'),L=$('lyrics'),body=document.body;
function fmt(t){t=Math.max(0,t|0);var h=t/3600|0,m=(t%3600)/60|0,s=t%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(s<10?'0':'')+s}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var totalDur=CFG.duration||cues[cues.length-1].e;

// chapters: compute ends
chaps.forEach(function(c,k){c.e=k<chaps.length-1?chaps[k+1].s:totalDur});
// build lyric list with chapter headings
var html=[],chapAt={};chaps.forEach(function(c,k){chapAt[c.i]=k});
for(var i=0;i<cues.length;i++){var c=cues[i];
 if(chapAt[i]!==undefined){var k=chapAt[i],ch=chaps[k];html.push('<div class="chap-h" data-ch="'+k+'"><span class="n">'+esc(U('chapN',k+1))+' · '+fmt(ch.s)+'</span><span class="z">'+esc(ch.tr)+'</span><span class="e">'+esc(ch.en)+'</span></div>')}
 html.push('<div class="cue" role="listitem" data-i="'+i+'"><div class="ts"><span class="tm">'+fmt(c.s)+'</span></div><div class="en">'+esc(c.en)+'</div><div class="zh">'+esc(c.tr)+'</div></div>')}

var els=L.querySelectorAll('.cue');
// progress segments + chapter sheet
var segs=$('segs'),sh=[],ch2=[];
chaps.forEach(function(c,k){var d=document.createElement('div');d.className='sg';d.style.flex=Math.max(.001,(c.e-c.s))+' 1 0';d.innerHTML='<div class="sf"></div>';segs.appendChild(d);sh.push(d)});
$('chCount').textContent=U('chCount',chaps.length);
$('clist').innerHTML=chaps.map(function(c,k){return '<div class="ci" data-ch="'+k+'"><div class="no">'+(k+1)+'</div><div class="bd"><div class="z">'+esc(c.tr)+'</div><div class="e">'+esc(c.en)+'</div></div><div class="tm">'+fmt(c.s)+'<small>'+fdur(c.e-c.s)+'</small></div></div>'}).join('');
var cis=$('clist').children;
// prefs
var mode=st.mode||'both',swap=!!st.swap,follow=st.follow!==false,big=!!st.big,strip=st.strip!==false,speeds=[0.75,1,1.25,1.5,1.75,2],rate=st.rate||1;
function tog(id,v){$(id).textContent=v?U('on'):U('off');$(id).classList.toggle('on',v)}
function applyPrefs(){body.classList.remove('m-both','m-en','m-zh');body.classList.add('m-'+mode);body.classList.toggle('swap',swap);body.classList.toggle('big',big);body.classList.toggle('strip-off',!strip);
 [].forEach.call($('modeSeg').children,function(b){b.classList.toggle('on',b.dataset.m===mode)});
 $('modeBtn').textContent=mode==='both'?(swap?U('modeSwap'):U('modeBoth')):(mode==='en'?U('modeSrc'):U('modeTgt'));
 tog('swapBtn',swap);tog('bigBtn',big);tog('followBtn2',follow);tog('stripBtn',strip);$('follow').classList.toggle('off',!follow);
 $('handle').setAttribute('aria-expanded',strip?'true':'false');
 $('speed').textContent=(rate+'').replace(/^0/,'')+'×';au.playbackRate=rate;au.defaultPlaybackRate=rate;
 st.mode=mode;st.swap=swap;st.follow=follow;st.big=big;st.rate=rate;st.strip=strip;save();
 requestAnimationFrame(setPH)}
function setPH(){document.documentElement.style.setProperty('--ph',$('player').offsetHeight+'px')}
applyPrefs();
$('menuBtn').onclick=function(e){e.stopPropagation();$('menu').classList.toggle('show')};
document.addEventListener('click',function(e){if(!$('menu').contains(e.target)&&e.target!==$('menuBtn'))$('menu').classList.remove('show')});
$('modeSeg').onclick=function(e){if(e.target.dataset.m){mode=e.target.dataset.m;applyPrefs();updLine();recenter(true)}};
$('modeBtn').onclick=function(){if(mode==='both'&&!swap){swap=true}else if(mode==='both'){mode='en';swap=false}else if(mode==='en'){mode='zh'}else{mode='both';swap=false}applyPrefs();updLine();recenter(true)};
$('swapBtn').onclick=function(){swap=!swap;applyPrefs();updLine();recenter(true)};
$('bigBtn').onclick=function(){big=!big;applyPrefs();recenter(true)};
function setStrip(v){strip=v;applyPrefs();setTimeout(function(){setPH();recenter(false)},320)}
$('stripBtn').onclick=function(){setStrip(!strip)};
$('handle').onclick=function(){setStrip(!strip)};
$('hideStrip').onclick=function(){setStrip(false)};
$('followBtn2').onclick=$('follow').onclick=function(){setFollow(!follow)};
function setFollow(v){follow=v;applyPrefs();$('back').classList.toggle('show',!follow&&cur>=0);if(follow)recenter(false)}
$('speed').onclick=function(){var i=speeds.indexOf(rate);rate=speeds[(i+1)%speeds.length];applyPrefs()};
// tracking
var cur=-1,curCh=-1;
function find(t){var lo=0,hi=starts.length-1,r=-1;while(lo<=hi){var m=(lo+hi)>>1;if(starts[m]<=t+0.05){r=m;lo=m+1}else hi=m-1}return r}
function findCh(t){var r=0;for(var k=0;k<chaps.length;k++){if(chaps[k].s<=t+0.05)r=k;else break}return r}
var scrollAnim=null,progScroll=false,lastProg=0,lastTop=0;
function smoothTo(y,instant){y=Math.max(0,Math.min(y,L.scrollHeight-L.clientHeight));if(scrollAnim)cancelAnimationFrame(scrollAnim);
 if(instant){progScroll=true;L.scrollTop=y;lastTop=y;setTimeout(function(){progScroll=false;lastProg=Date.now()},50);return}
 var y0=L.scrollTop,d=y-y0,t0=null,D=Math.min(700,250+Math.abs(d)*0.4);if(Math.abs(d)<1)return;progScroll=true;
 function step(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/D),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;L.scrollTop=y0+d*e;
  if(p<1)scrollAnim=requestAnimationFrame(step);else{scrollAnim=null;lastTop=L.scrollTop;setTimeout(function(){progScroll=false;lastProg=Date.now()},30)}}
 scrollAnim=requestAnimationFrame(step)}
function recenter(instant){if(cur<0||!follow)return;var el=els[cur];var y=el.offsetTop-(L.clientHeight-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ph'))||240))*0.45+el.offsetHeight/2;smoothTo(y,instant)}
function updLine(){if(cur>=0)$('curLine').textContent=(mode==='zh'||(mode==='both'&&swap))?cues[cur].tr:cues[cur].en}
function setCur(i,instant){if(i===cur)return;var old=cur;cur=i;if(old>=0&&els[old])els[old].classList.remove('active');
 var a=Math.min(old,i),b=Math.max(old,i);if(old<0){a=0;b=els.length-1}
 for(var k=Math.max(0,a);k<=Math.min(els.length-1,b);k++)els[k].classList.toggle('past',k<i);
 if(i>=0){els[i].classList.add('active');updLine();recenter(instant)}}
function setCh(k){if(k===curCh)return;var old=curCh;curCh=k;
 for(var j=0;j<cis.length;j++){cis[j].classList.toggle('cur',j===k);cis[j].classList.toggle('done',j<k);
  var no=cis[j].firstChild;no.innerHTML=j===k?'<span class="eq"><i></i><i></i><i></i></span>':(j+1)}
 sh.forEach(function(s,j){s.classList.toggle('cur',j===k)});
 var c=chaps[k];$('chapTitle').innerHTML=esc(c.tr)+'<small>'+esc(c.en)+'</small>';$('chapIdx').textContent=(k+1)+'/'+chaps.length;
 if('mediaSession' in navigator&&window.MediaMetadata){try{navigator.mediaSession.metadata=new MediaMetadata({title:c.tr+' · '+c.en,artist:CFG.show,album:CFG.epTitle,artwork:[{src:document.querySelector('#meta img').src,sizes:'180x180',type:'image/jpeg'}]})}catch(e){}}}
function paintBar(t){var d=dur();for(var k=0;k<chaps.length;k++){var c=chaps[k],p=t>=c.e?1:(t<=c.s?0:(t-c.s)/(c.e-c.s));sh[k].firstChild.style.width=(p*100)+'%'}
 $('knob').style.left=(Math.min(1,t/d)*100)+'%'}
// user scroll
function userScroll(){if(scrollAnim){cancelAnimationFrame(scrollAnim);scrollAnim=null;progScroll=false}if(follow){follow=false;applyPrefs()}$('back').classList.add('show')}
L.addEventListener('touchmove',userScroll,{passive:true});L.addEventListener('wheel',userScroll,{passive:true});
L.addEventListener('scroll',function(){if(progScroll){lastProg=Date.now();lastTop=L.scrollTop;return}if(Date.now()-lastProg>400&&Math.abs(L.scrollTop-lastTop)>40)userScroll()});
$('back').onclick=function(){setFollow(true);$('back').classList.remove('show')};
L.addEventListener('click',function(e){var h=e.target.closest&&e.target.closest('.chap-h');if(h){goCh(+h.dataset.ch);return}
 var el=e.target.closest?e.target.closest('.cue'):null;if(!el)return;seek(cues[+el.dataset.i].s+0.01);setFollow(true);$('back').classList.remove('show');play()});
// chapters nav
function goCh(k){k=Math.max(0,Math.min(chaps.length-1,k));seek(chaps[k].s+0.01);setFollow(true);$('back').classList.remove('show');play()}
$('prevCh').onclick=function(){var t=au.currentTime,k=findCh(t);if(t-chaps[k].s>3)goCh(k);else goCh(k-1)};
$('nextCh').onclick=function(){goCh(findCh(au.currentTime)+1)};
function openSheet(){body.classList.add('sheet-open');var c=cis[curCh];if(c){var cl=$('clist');cl.scrollTop=c.offsetTop-cl.clientHeight/2+c.offsetHeight/2}}
function closeSheet(){body.classList.remove('sheet-open')}
$('chapRow').onclick=openSheet;$('sheetBg').onclick=closeSheet;$('sheetX').onclick=closeSheet;
$('clist').onclick=function(e){var r=e.target.closest('.ci');if(!r)return;goCh(+r.dataset.ch);setTimeout(closeSheet,180)};
// player
function play(){if(!au.src){pendingPlay=true;return}var p=au.play();if(p&&p.catch)p.catch(function(){})}
var pendingPlay=false;
$('play').onclick=function(){au.paused?play():au.pause()};
$('b15').onclick=function(){seek(au.currentTime-15)};$('f30').onclick=function(){seek(au.currentTime+30)};
function seek(t){t=Math.max(0,Math.min(dur()-0.2,t));try{au.currentTime=t}catch(e){}pendingSeek=t;update(true)}
var pendingSeek=null;
function curT(){return au.src&&au.readyState>0?au.currentTime:(pendingSeek!=null?pendingSeek:(+st.pos||0))}
var PI_PLAY='M8 5v14l11-7z',PI_PAUSE='M6 19h4V5H6v14zm8-14v14h4V5h-4z';
function setIcon(){$('pi').firstChild.setAttribute('d',au.paused?PI_PLAY:PI_PAUSE);body.classList.toggle('paused',au.paused)}
au.addEventListener('play',setIcon);au.addEventListener('pause',function(){setIcon();st.pos=au.currentTime;save()});
var dragging=false,lastSave=0;
function update(instant){var t=curT(),d=dur();
 if(!dragging){paintBar(t);$('el').textContent=fmt(t);$('rem').textContent='-'+fmt(d-t)}
 setCh(findCh(t));setCur(find(t),instant===true);
 var now=Date.now();if(au.src&&au.readyState>0&&now-lastSave>2000){lastSave=now;st.pos=t;save()}}
au.addEventListener('timeupdate',function(){update(false)});au.addEventListener('seeked',function(){update(false)});
au.addEventListener('ratechange',function(){if(au.playbackRate!==rate)au.playbackRate=rate});
(function tick(){if(!au.paused)update(false);setTimeout(tick,250)})();
// scrubber with chapter tooltip
var bar=$('bar');
function posFromEvt(e){var r=bar.getBoundingClientRect();var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;return Math.max(0,Math.min(1,x/r.width))}
function dragMove(e){var p=posFromEvt(e),t=p*dur(),k=findCh(t);paintBar(t);$('el').textContent=fmt(t);$('rem').textContent='-'+fmt(dur()-t);bar._p=p;
 var tip=$('tip');tip.innerHTML=esc(chaps[k].tr)+' · '+esc(chaps[k].en)+'<small>'+fmt(t)+'</small>';var w=tip.offsetWidth,bw=bar.offsetWidth,x=Math.max(w/2,Math.min(bw-w/2,p*bw));tip.style.left=x+'px';if(e.cancelable)e.preventDefault()}
function dragEnd(){if(!dragging)return;dragging=false;bar.classList.remove('drag');seek(bar._p*dur());setFollow(true);$('back').classList.remove('show');window.removeEventListener('pointermove',dragMove);window.removeEventListener('pointerup',dragEnd)}
bar.addEventListener('pointerdown',function(e){dragging=true;bar.classList.add('drag');dragMove(e);window.addEventListener('pointermove',dragMove);window.addEventListener('pointerup',dragEnd)});
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();au.paused?play():au.pause()}else if(e.code==='ArrowLeft')seek(au.currentTime-5);else if(e.code==='ArrowRight')seek(au.currentTime+5)});
if('mediaSession' in navigator){try{navigator.mediaSession.setActionHandler('play',play);navigator.mediaSession.setActionHandler('pause',function(){au.pause()});
 navigator.mediaSession.setActionHandler('seekbackward',function(){seek(au.currentTime-15)});navigator.mediaSession.setActionHandler('seekforward',function(){seek(au.currentTime+30)});
 navigator.mediaSession.setActionHandler('previoustrack',function(){$('prevCh').onclick()});navigator.mediaSession.setActionHandler('nexttrack',function(){$('nextCh').onclick()});
 try{navigator.mediaSession.setActionHandler('seekto',function(d){seek(d.seekTime)})}catch(e){}}catch(e){}}
window.addEventListener('pagehide',function(){if(au.readyState>0){st.pos=au.currentTime;save()}});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(au.readyState>0){st.pos=au.currentTime;save()}}else recenter(true)});
window.addEventListener('resize',function(){setPH();recenter(true)});
// initial render before audio
setPH();update(true);
// audio source
function status(msg){var s=$('status');s.textContent=msg||'';s.classList.toggle('show',!!msg);setPH()}
function attach(src){au.src=src;au.load();var restore=+st.pos||0;
 au.addEventListener('loadedmetadata',function(){var t=pendingSeek!=null?pendingSeek:restore;if(t>1){try{au.currentTime=t}catch(e){}}update(true);if(pendingPlay){pendingPlay=false;play()}},{once:true});
 au.addEventListener('error',function(){status(U('loadFail'))},{once:true});
 window.__playerReady=true}
if(CFG.audio==='embed'){
 var b64el=$('b64');status(U('preparing',0));
 setTimeout(function(){try{
  var s=b64el.textContent,CH=524288,pos=0,parts=[],n=s.length;
  (function step(){var end=Math.min(n,pos+CH);var chunk=s.substring(pos,end).replace(/[^A-Za-z0-9+\/=]/g,'');
   var bin=atob(chunk),u=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);parts.push(u);pos=end;
   if(pos<n){status(U('preparing',Math.round(pos/n*100)));setTimeout(step,0)}
   else{var blob=new Blob(parts,{type:'audio/mpeg'});window.__audioBytes=blob.size;b64el.textContent='';s=null;attach(URL.createObjectURL(blob));status('')}})();
 }catch(err){console.error(err);status(U('decodeFail'))}},30);
}else{attach(CFG.audioUrl)}
})();
</script>
