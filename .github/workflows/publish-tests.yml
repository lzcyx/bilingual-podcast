name: Publish preflight tests

on:
  pull_request:
    paths:
      - "scripts/publish.py"
      - "scripts/llm/client.py"
      - "tests/test_publish.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/publish.py"
      - "scripts/llm/client.py"
      - "tests/test_publish.py"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  publish-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test publish staging, usage and replay
        run: python -m unittest discover -s tests -p test_publish.py
