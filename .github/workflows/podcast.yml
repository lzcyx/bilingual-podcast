name: Podcast bilingual pipeline

on:
  schedule:
    # 23:30 Asia/Shanghai every day
    - cron: "30 15 * * *"
    # 08:00 Asia/Shanghai on Saturday (PlayStation official podcast)
    - cron: "0 0 * * 6"
  workflow_dispatch:
    inputs:
      show_id:
        description: "节目 id（shows.yaml，例如 ignuk）。留空则只处理新节目。"
        required: false
        type: string
      guid:
        description: "要补做的单期 guid（没有 guid 时填音频 URL）。必须和 show_id 一起填。"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: bilingual-podcast
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check feeds
        id: plan
        env:
          SHOW_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.show_id || '' }}
          EPISODE_GUID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.guid || '' }}
        run: |
          pip install pyyaml
          python scripts/check_feeds.py --out run/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: run/plan.json
          retention-days: 7
          if-no-files-found: error

  build:
    needs: check
    if: needs.check.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        episode: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore Whisper and diarization models
        id: model-cache
        if: success()
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/podcast-bilingual-player
          key: models-${{ runner.os }}-whisper-large-v3-turbo-diar-v1
      - name: Check required secrets
        env:
          EPISODE_SPEC: ${{ toJson(matrix.episode) }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python scripts/check_secrets.py
      - name: Install ffmpeg, Python deps, Chromium
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build episode
        if: success()
        env:
          EPISODE_SPEC: ${{ toJson(matrix.episode) }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/build_episode.py
      - name: Save models after a successful build
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/podcast-bilingual-player
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.episode.artifact }}
          path: runs/artifact/
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: [check, build]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'failure' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: run/plan
      - name: Download episode results
        if: needs.check.outputs.has_work == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ep-*
          path: run/results
      - name: Publish to R2 and write state
        id: publish
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          pip install pyyaml boto3
          python scripts/publish.py --plan run/plan/plan.json --results run/results
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json state/failed.json state/index.json
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "Update podcast state"
            git push
          fi
      - name: Fail the job if publish failed
        if: steps.publish.outcome == 'failure'
        run: exit 1
