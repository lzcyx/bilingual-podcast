#shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,12,28,.55) 0%,rgba(8,12,28,.25) 35%,rgba(8,12,28,.45) 70%,rgba(5,8,18,.92) 100%)}
#top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
#top .t{flex:1;min-width:0}
#top .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .t span{display:block;font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:rgba(255,255,255,.9);color:var(--c-base)}
#menu{position:fixed;z-index:30;right:12px;top:calc(var(--safe-t) + 54px);background:rgba(20,24,40,.95);border-radius:14px;padding:8px;display:none;min-width:240px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#menu.show{display:block}
#menu .row{display:flex;align-items:center;justify-content:space-between;padding:9px 8px;font-size:14px;gap:12px}
#menu .seg{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:2px}
#menu .seg button{border:0;background:transparent;color:#fff;padding:5px 10px;border-radius:7px;font-size:13px;cursor:pointer}
#menu .seg button.on{background:rgba(255,255,255,.9);color:var(--c-base);font-weight:700}
#lyrics{position:fixed;inset:0;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
 padding:42vh 22px calc(50vh + var(--safe-b)) 22px;
 -webkit-mask-image:linear-gradient(180deg,transparent 0,transparent calc(var(--safe-t) + 52px),#000 calc(var(--safe-t) + 120px),#000 calc(100% - var(--ph,240px) - 50px),transparent calc(100% - var(--ph,240px) + 10px));
 mask-image:linear-gradient(180deg,transparent 0,transparent calc(var(--safe-t) + 52px),#000 calc(var(--safe-t) + 120px),#000 calc(100% - var(--ph,240px) - 50px),transparent calc(100% - var(--ph,240px) + 10px))}
#lyrics::-webkit-scrollbar{display:none}
.cue{padding:9px 6px;margin:2px 0;border-radius:12px;cursor:pointer;opacity:.34;transform-origin:left center;transition:opacity .35s ease,transform .35s ease}
.cue:active{background:rgba(255,255,255,.08)}
.cue .ts{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums;letter-spacing:.3px;margin-bottom:3px;font-weight:600;display:flex;align-items:center;gap:8px}
.cue .en{font-size:21px;line-height:1.3;font-weight:750;letter-spacing:-.2px}
.cue .zh{font-size:18px;line-height:1.45;font-weight:500;margin-top:4px;opacity:.9}
.cue.past{opacity:.28}
.cue.active{opacity:1;transform:scale(1.04)}
.cue.active .ts{opacity:1}.cue.active .ts .tm{color:var(--accent)}
.chap-h{margin:26px 6px 8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.chap-h .n{font-size:11px;font-weight:800;opacity:.6;letter-spacing:.5px;white-space:nowrap}
.chap-h .z{font-size:15px;font-weight:800}.chap-h .e{font-size:12px;opacity:.6}
body.swap .cue{display:flex;flex-direction:column}
body.swap .cue .zh{order:1;margin-top:0;font-size:21px;font-weight:700;opacity:1}
body.swap .cue .en{order:2;margin-top:4px;font-size:17px;font-weight:600;opacity:.85}
body.m-en .cue .zh{display:none}
body.m-zh .cue .en{display:none}
body.m-zh .cue .zh{font-size:22px;font-weight:700;margin-top:0;opacity:1}
body.big .cue .en{font-size:25px} body.big .cue .zh{font-size:21px}
#back{position:fixed;z-index:6;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--ph,240px) + 14px);opacity:0;pointer-events:none;transition:all .25s ease;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:var(--c-base);font-weight:700;font-size:14px;padding:10px 16px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.45);cursor:pointer}
#back.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:4px 18px calc(10px + var(--safe-b));background:rgba(12,16,30,.74);border-top:1px solid rgba(255,255,255,.08)}
#handle{display:flex;justify-content:center;align-items:center;height:18px;margin:0 auto 2px;width:90px;border:0;background:transparent;cursor:pointer;padding:0}
#handle span{display:block;width:38px;height:5px;border-radius:5px;background:rgba(255,255,255,.35);transition:all .2s}
body.strip-off #handle span{width:22px;height:10px;background:transparent;border:solid rgba(255,255,255,.6);border-width:2.5px 2.5px 0 0;border-radius:2px;transform:rotate(-45deg) translate(-2px,3px)}
#meta{display:flex;align-items:center;gap:12px;overflow:hidden;max-height:70px;transition:max-height .28s ease,opacity .2s ease,margin .28s ease;margin-bottom:8px}
body.strip-off #meta{max-height:0;opacity:0;margin-bottom:0}
#meta img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
#meta .mt{flex:1;min-width:0}
#meta .mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta .mt span{display:block;font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hideStrip{border:0;background:rgba(255,255,255,.12);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none;font-size:15px;line-height:30px;padding:0}
#chapRow{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#fff;width:100%;padding:2px 0;cursor:pointer;text-align:left}
#chapRow .ic{flex:none;width:18px;height:18px;opacity:.85}
#chapRow .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:750}
#chapRow .tx small{font-weight:500;opacity:.6;font-size:12px;margin-left:6px}
#chapRow .ix{flex:none;font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
#bar{margin:8px 0 2px;position:relative;height:22px;touch-action:none;cursor:pointer}
#segs{position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;display:flex;gap:3px}
.sg{height:100%;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;min-width:2px;transition:height .15s,transform .15s}
.sg .sf{height:100%;width:0;background:#fff}
.sg.cur{transform:scaleY(1.35)}
#bar.drag .sg{transform:scaleY(1.6)}
#knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;left:0;box-shadow:0 1px 6px rgba(0,0,0,.4);transition:transform .15s;pointer-events:none}
#bar.drag #knob{transform:scale(1.35)}
#tip{position:absolute;bottom:26px;left:0;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--c-base);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:78vw;overflow:hidden;text-overflow:ellipsis}
#tip small{display:block;font-weight:600;opacity:.6;font-variant-numeric:tabular-nums}
#bar.drag #tip{opacity:1}
#times{display:flex;justify-content:space-between;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
#ctl{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
#ctl button{border:0;background:transparent;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center;min-width:40px}
#ctl svg{width:28px;height:28px;fill:#fff}
#ctl .ch svg{width:24px;height:24px}
#play svg{width:50px;height:50px}
#speed{font-weight:800;font-size:13px;border:1.5px solid rgba(255,255,255,.55)!important;border-radius:8px;padding:3px 5px!important;min-width:44px!important}
#follow{flex-direction:column;font-size:10px;font-weight:700;gap:1px}
#follow svg{width:20px;height:20px}
#follow.off{opacity:.4}
#status{font-size:11px;opacity:.75;text-align:center;margin-top:2px;display:none}
#status.show{display:block}
#sheetBg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78vh;display:flex;flex-direction:column;background:rgba(22,26,44,.97);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
body.sheet-open #sheetBg{opacity:1;pointer-events:auto}
body.sheet-open #sheet{transform:translateY(0)}
#sheet .hd{display:flex;align-items:center;padding:8px 18px 10px;gap:10px}
#sheet .grab{width:38px;height:5px;border-radius:5px;background:rgba(255,255,255,.3);margin:8px auto 2px}
#sheet .hd b{font-size:17px;flex:1}
#sheet .hd span{font-size:12px;opacity:.6}
#sheet .x{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}
#clist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 14px}
.ci{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:12px;cursor:pointer}
.ci:active{background:rgba(255,255,255,.06)}
.ci .no{width:22px;flex:none;text-align:center;font-size:13px;font-weight:800;opacity:.5;font-variant-numeric:tabular-nums}
.ci .bd{flex:1;min-width:0}
.ci .z{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .e{font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ci .tm{flex:none;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;opacity:.75;line-height:1.35}
.ci .tm small{display:block;opacity:.65;font-size:11px}
.ci.cur{background:rgba(255,255,255,.1)}
.ci.cur .no{opacity:1;color:var(--accent)}
.ci.cur .z{color:var(--accent)}
.ci.done .z,.ci.done .e{opacity:.55}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
body.paused .eq i{animation:none;height:5px}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
@media (min-width:760px){#lyrics{padding-left:max(22px,calc(50vw - 360px));padding-right:max(22px,calc(50vw - 360px))}#player{padding-left:max(18px,calc(50vw - 380px));padding-right:max(18px,calc(50vw - 380px))}#sheet{left:calc(50vw - 380px);right:calc(50vw - 380px)}}

/* Dual style (S = Spotify, B = Apple), switched live via body.theme-S / body.theme-B. Theme rules use :where() so
   their specificity equals the base rules they override (same cascade as the old separate templates). Colours
   are injected by build.py. */
body.theme-S{
  --c-base:#2d6a9a;--c-top:#3281bd;--accent:#fff;
  background:var(--c-base);color:#fff;
}
:where(body.theme-S) #shade{background:linear-gradient(180deg,var(--c-top) 0%,var(--c-base) 17%,var(--c-base) 100%)}
:where(body.theme-S) #bg{display:none}
:where(body.theme-S) .chip{background:rgba(0,0,0,.24);backdrop-filter:none;-webkit-backdrop-filter:none}

:where(body.theme-S) #menu .seg{background:#3e3e3e}
:where(body.theme-S) #menu .seg button.on{background:#fff;color:#000}
:where(body.theme-S) #top .t span{color:rgba(255,255,255,.75);opacity:1}
:where(body.theme-S) .cue{opacity:1;color:rgba(0,0,0,.55);transform:none}

:where(body.theme-S) .cue .ts{opacity:.8}
:where(body.theme-S) .cue.past{opacity:1;color:rgba(255,255,255,.65)}
:where(body.theme-S) .cue.active{opacity:1;color:#fff;transform:none}
:where(body.theme-S) .cue.active .ts,:where(body.theme-S) .cue.active .ts .tm{color:#fff;opacity:1}
:where(body.theme-S) .cue .en{font-size:22px;font-weight:800}
:where(body.theme-S) .cue .zh{font-weight:700}
:where(body.theme-S) .cue:active{background:rgba(0,0,0,.1)}
:where(body.theme-S) .chap-h{background:rgba(0,0,0,.2);color:#fff}

:where(body.theme-S) #hideStrip{background:#2a2a2a}
:where(body.theme-S) .sg{background:rgba(255,255,255,.3)}
:where(body.theme-S) .sg .sf{background:#fff}
:where(body.theme-S) #knob{box-shadow:none}
:where(body.theme-S) #tip{background:#fff;color:#000;box-shadow:0 4px 12px rgba(0,0,0,.5)}
:where(body.theme-S) #speed{border-color:#7a7a7a!important}
:where(body.theme-S) #play{width:56px;height:56px;min-width:56px!important;border-radius:50%;background:#fff!important;padding:0!important}
:where(body.theme-S) #play svg{width:28px;height:28px;fill:#000}
:where(body.theme-S) #sheetBg{background:rgba(0,0,0,.6)}
:where(body.theme-S) #sheet{background:#282828;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
:where(body.theme-S) #sheet .hd{border-bottom:1px solid #3a3a3a}
:where(body.theme-S) #sheet .hd span{color:#b3b3b3;opacity:1}
:where(body.theme-S) #sheet .grab{background:#5a5a5a}
:where(body.theme-S) #sheet .x{background:#3e3e3e}
:where(body.theme-S) .ci .e,:where(body.theme-S) .ci .tm small{color:#b3b3b3;opacity:1}
:where(body.theme-S) .ci .no{color:#b3b3b3;opacity:1}
:where(body.theme-S) .ci .tm{color:#b3b3b3;opacity:1}

:where(body.theme-S) .ci.cur .no,:where(body.theme-S) .ci.cur .z{color:#fff;font-weight:800}

<script id="cues" type="application/json">[{"s": 17.7, "e": 20.72, "en": "Hey everybody, welcome back to the Official PlayStation Podcast.", "tr": "嘿，大家好，欢迎回到官方 PlayStation 播客。", "spk": "S0"}, {"s": 20.72, "e": 23.56, "en": "It's your boy O'Dell here with Kristen Zatani.", "tr": "我是你们的 O'Dell，和我一起的是 Kristen Zatani。", "spk": "S0"}, {"s": 23.82, "e": 28.88, "en": "Hello. We are here today. We got another jam-packed show for you today.", "tr": "你好。我们今天在这儿。今天又有一档内容满满的节目要带给大家。", "spk": "S0"}, {"s": 29.98, "e": 33.02, "en": "So, 550. Oh, my God.", "tr": "所以，第550期。哦，我的天。", "spk": "S0"}, {"s": 33.26, "e": 35.96, "en": "Wow. 550. That's crazy, actually.", "tr": "哇。550期。这真的太疯狂了。", "spk": "S1"}, {"s": 36.6, "e": 40.74, "en": "Yeah. I feel like we hit these milestones and, like, they come up totally by surprise.", "tr": "是啊。我感觉我们每次到达这些里程碑，它们都是完全出乎意料地就来了。", "spk": "S1"}, {"s": 40.86, "e": 42.96, "en": "Like, we're just not even aware that it's happening.", "tr": "就好像我们根本没意识到它正在发生。", "spk": "S1"}, {"s": 43.0, "e": 45.24, "en": "And then it's like, wow, we've done another 50 episodes.", "tr": "然后突然就，哇，我们又做了50期。", "spk": "S1"}, {"s": 45.32, "e": 48.46, "en": "That's wild. I remember we did the 500 episode a while back.", "tr": "太疯狂了。我记得我们不久前做了第500期。", "spk": "S1"}, {"s": 48.96, "e": 51.52, "en": "And we were, like, going through all of our favorite PlayStation games.", "tr": "然后我们就在那儿回顾我们最喜欢的 PlayStation 游戏。", "spk": "S1"}, {"s": 51.52, "e": 52.14, "en": "I feel like that was", "tr": "我感觉那好像是", "spk": "S1"}, {"s": 52.14, "e": 54.26, "en": "right at the end of the year or beginning of the year.", "tr": "正好在年底或者年初的时候。", "spk": "S0"}, {"s": 54.32, "e": 55.38, "en": "I felt like it was. Yeah.", "tr": "我觉得是。", "spk": "S0"}, {"s": 55.46, "e": 55.56, "en": "But", "tr": "但是", "spk": "S0"}, {"s": 55.56, "e": 58.16, "en": "it must have been, like, two years ago, though.", "tr": "那肯定得是大概两年前了吧。", "spk": "S1"}, {"s": 58.16, "e": 62.9, "en": "Because if we did 50 episodes, and we definitely don' ogether.", "tr": "对，很荣幸。Roguelike式的进程，一旦你把这两者放在一起看，就觉得它和赛车游戏简直是天作之合。", "spk": "S3"}, {"s": 661.83, "e": 667.47, "en": "When the project first began, was that already part of the idea or did it emerge later on?", "tr": "项目刚开始的时候，这已经是想法的一部分了，还是后来才出现的？", "spk": "S3"}, {"s": 667.47, "e": 673.27, "en": "It's funny. Actually, we like to say runs-based, and it sounds like we're making some sort of funky distinction,", "tr": "说来有趣。其实我们喜欢叫它“以跑局为基础”，听起来好像我们在做什么奇怪的区分，", "spk": "S3"}, {"s": 673.49, "e": 680.07, "en": "but we're not really. Technically, the game is a roguelite because it's got elements of sort of procedural aspects to it,", "tr": "但其实并没有。严格来说，这游戏是roguelite，因为它有那种程序生成方面的元素，", "spk": "S3"}, {"s": 680.19, "e": 683.67, "en": "and it has a death loop, but it has aspects of meta progression that you take with you.", "tr": "而且它有一个死亡循环，但它也有你带着走的元进程元素。", "spk": "S3"}, {"s": 683.67, "e": 685.45, "en": "So the next time you start a run, you're more powerful.", "tr": "所以下次你开始一局跑局时，你会更强。", "spk": "S3"}, {"s": 685.61, "e": 690.85, "en": "But we like runs-based, because runs has got a context in Star Wars, and it's got a context in racing.", "tr": "但我们喜欢“以跑局为基础”这个说法，因为“跑局”在《星球大战》里有语境，在赛车中也有语境。", "spk": "S3"}, {"s": 690.85, "e": 693.65, "en": "And this game is a combination of our love of both.", "tr": "而这个游戏就是我们热爱这两者的结合。", "spk": "S3"}, {"s": 693.83, "e": 696.81, "en": "When I first heard it, I was like, huh?", "tr": "我第一次听说的时候，就想，哈？", "spk": "S3"}, {"s": 697.19, "e": 701.47, "en": "How's that gonna work? And then the idea started to take shape.", "tr": "这要怎么运作？然后这个想法就开始成形了。", "spk": "S3"}, {"s": 701.69, "e": 706.65, "en": "And then you can say to think to yourself, wow, this just seems like a perfect match.", "tr": "然后你可以对自己说，哇，这看起来简直就是完美搭配。", "spk": "S3"}, {"s": 706.83, "e": 710.67, "en": "I remember pitching it in. The first page we all just agreed on.", "tr": "我记得在提案的时候。第一页我们全都一致同意。", "spk": "S4"}, {"s": 710.79, "e": 715.79, "en": "It was like, hey, we want replayability, orld itself.", "tr": "因为很明显，每个星球上，玩家和世界本身之间都有非常非常有趣的环境互动。", "spk": "S3"}, {"s": 831.75, "e": 834.09, "en": "So what came first at the chicken or the egg?", "tr": "所以到底是先有鸡还是先有蛋？", "spk": "S3"}, {"s": 835.67, "e": 839.11, "en": "This is a combination of a love of racing and a love of Star Wars.", "tr": "这是对赛车的热爱和对《星球大战》的热爱的结合。", "spk": "S3"}, {"s": 839.11, "e": 839.33, "en": "finish this up flying around with the Rolling Stones Exodus.", "tr": "最后再放一首《滚石》的Exodus来收尾吧。", "spk": "S3"}, {"s": 839.33, "e": 839.33, "en": "So what came first?", "tr": "所以到底先有什么？", "spk": "S3"}, {"s": 839.35, "e": 844.65, "en": "But we'll start with, we'll start with the racing first, you know, in terms of what's that core experience that we want?", "tr": "但我们先从赛车开始，你知道，从我们想要的核心体验是什么开始？", "spk": "S3"}, {"s": 844.87, "e": 848.75, "en": "You know, how do we want this thing to feel and the experiential part of it?", "tr": "你知道，我们希望这东西感觉如何，体验部分是什么样的？", "spk": "S3"}, {"s": 848.93, "e": 853.69, "en": "And then as we bring the Star Wars component into it, that actually just unlocks a bunch of opportunity.", "tr": "然后当我们把《星球大战》的元素加进来时，那实际上就打开了一堆机会。", "spk": "S3"}, {"s": 854.23, "e": 861.81, "en": "What better sort of emotional fantasy that you might have than sort of racing, racing speeders through the wreckage of Star Destroyers?", "tr": "还有什么比在歼星舰的残骸中飞梭赛车更棒的情感幻想呢？", "spk": "S3"}, {"s": 861.95, "e": 863.35, "en": "I mean, that just sounds really super cool.", "tr": "我是说，那听起来就超级酷。", "spk": "S3"}, {"s": 863.51, "e": 870.05, "en": "So, you know, that's bringing the inspiration of Star Wars into this vision of racing that we wanted to execute against.", "tr": "所以，你知道，这就是把《星球大战》的灵感带入我们想要实现的赛车愿景中。", "spk": "S3"}, {"s": 870.19, "e": 874.61, "en": "You know, we maybe got some big drifting experience that would speak to a frozen planet.", "tr": "你知道，我们可能有一些很棒的漂移体验，适合一个冰冻星球。", "spk": "S4"}, {"s": 874.89, "e": 882.49, "en": "We might have a new boost system with the Ramjet system that needs heat in and cooling and can interact with the environment in different ways.", "tr": "我们可能有新的冲压发动机助推系统，需要加热和冷却，能以不同方式与环境互动。", "spk": "S4"}, {"s": 882.49, "e": 886.25, "en": "But that's kind of happening in the abstract so that we know we've got some depth and some fun.", "tr": "但那是在抽象层面发生的，这样我们就知道有深度也有乐趣。", "spk": "S4"}, {"s": 886.43, "e": 890.33, "en": "And there's another thing which is like, I want to race for a Star Destroyer.", "tr": "还有另一件事，就是我想绕着歼星舰赛车。", "spk": "S4"}, {"s": 890.45, "e": 895.89, "en": "I want to go through Ando Prime and go through these cool little heating things that all great,", "tr": "我想穿过安多主星，穿过那些很酷的小加热装置，那些都很棒，", "spk": "S4"}, {"s": 895.91, "e": 898.71, "en": "these great kind of thread-the-needs little moments.", "tr": "那些很棒的穿针引线般的小瞬间。", "spk": "S4"}, {"s": 898.89, "e": 905.05, "en": "But we know that the planets in the Star Wars galaxy need to be a personality in their own right.", "tr": "但我们知道《星球大战》银河系里的星球需要有自己的个性。", "spk": "S4"}, {"s": 905.07, "e": 909.33, "en": "So we always knew they had to be a big expression of play, a big expression of emotion,", "tr": "所以我们一直知道它们必须是一种玩法的重大表达，一种情感的重大表达，", "spk": "S4"}, {"s": 909.33, "e": 913.67, "en": "and also something that would really pin it in the Star Wars galaxy in an authentic way.", "tr": "同时也得真正以真实的方式把它固定在《星球大战》银河系里。", "spk": "S4"}, {"s": 913.83, "e": 917.09, "en": "So it's just about knitting those things together once you have all the pieces.", "tr": "所以一旦你有了所有拼图，就只是把这些东西编织在一起。", "spk": "S4"}, {"s": 917.17, "e": 923.03, "en": "So that fantasy of racing through a Star Destroyer, for example, is a really powerful visual fantasy.", "tr": "所以，比如说，穿过歼星舰赛车的幻想，是一个非常强大的视觉幻想。", "spk": "S3"}, {"s": 923.03, "e": 926.25, "en": "But we also want them to have a component back into the gameplay.", "tr": "但我们也希望它们在玩法上有对应的部分。", "spk": "S3"}, {"s": 926.25, "e": 931.65, "en": "And that's then where, as Kiran has mentioned, those environmental conditions in the Ramjet come in.", "tr": "这就是Kieran提到的，那些环境条件和冲压发动机发挥作用的地方。", "spk": "S3"}, {"s": 931.79, "e": 933.17, "en": "So we're on a desert planet.", "tr": "所以我们在一个沙漠星球上。", "spk": "S3"}, {"s": 933.43, "e": 939.75, "en": "So the heat of those locations contributes to how you might be thinking about using that Ramjet,", "tr": "那些地点的热量会影响你如何考虑使用冲压发动机，", "spk": "S3"}, {"s": 939.79, "e": 942.35, "en": "which is enormous speed, but generates a huge amount of heat.", "tr": "它能带来极快的速度，但会产生巨大的热量。", "spk": "S3"}, {"s": 942.47, "e": 946.17, "en": "And the inverse is true when it comes to Ando Prime, which is cold.", "tr": "反过来，安多主星就很冷。", "spk": "S3"}, {"s": 946.17, "e": 952.39, "en": "So you can run that hot Ramjet for longer, but the extreme cold interferes with how the vehicle handles.", "tr": "所以你可以让冲压发动机热得更久，但极寒会干扰车辆的操控。", "spk": "S3"}, {"s": 952.39, "e": 960.15, "en": "So having those environments, as Kiran says, like a character amongst themselves, have an impact into gameplay was really important.", "tr": "所以正如Kieran所说，让这些环境像角色一样，对玩法产生影响，这非常重要。", "spk": "S3"}, {"s": 960.65, "e": 966.59, "en": "How do you build an evolving character story within that runs-based structure, where players might fail runs,", "tr": "你如何在这种基于轮次的结构中构建一个不断演变的角色故事，玩家可能会失败，", "spk": "S5"}, {"s": 966.73, "e": 969.27, "en": "repeat events, or progress at very different speeds?", "tr": "重复事件，或者以非常不同的速度推进？", "spk": "S5"}, {"s": 969.49, "e": 972.79, "en": "At the heart of that is just telling the story that you want to tell.", "tr": "这一切的核心，其实就是讲你想讲的那个故事。", "spk": "S4"}, {"s": 972.99, "e": 979.11, "en": "So we knew we wanted to tell a sports story, and we knew we wanted that sports story to be around replayability.", "tr": "所以我们很清楚，我们想讲一个体育故事，而且我们知道这个体育故事要围绕可重复游玩性来展开。", "spk": "S4"}, {"s": 979.47, "e": 983.99, "en": "We've got this runs structure that means that you're going to be replaying again.", "tr": "我们有这种一局一局的结构，意味着你会一遍又一遍地重玩。", "spk": "S4"}, {"s": 984.23, "e": 985.95, "en": "So what kind of makes sense that?", "tr": "那什么样的设定比较说得通呢？", "spk": "S4"}, {"s": 986.11, "e": 990.55, "en": "Well, leagues kind of already have that structure, you know, there's a new league every season.", "tr": "嗯，联赛本身其实就已经有这种结构了，你知道，每个赛季都有一个新的联赛。", "spk": "S4"}, {"s": 990.55, "e": 993.73, "en": "Everyone gets to go around, the winner is announced at the end of it.", "tr": "大家都能跑一圈，最后宣布冠军是谁。", "spk": "S4"}, {"s": 993.95, "e": 997.51, "en": "So it felt like, from a structural story point of view, that made sense.", "tr": "所以从故事结构的角度来看，这样是说得通的。", "spk": "S4"}, {"s": 997.67, "e": 1004.59, "en": "And then it was about just creating these big, kind of larger-than-life characters that can drive that story forward,", "tr": "然后接下来就是去创造那些大气的、有点传奇色彩的角色，让他们来推动这个故事往前走，", "spk": "S4"}, {"s": 1004.59, "e": 1011.33, "en": "which is how we came up with the player character, Shade, and our antagonist, Kestar Bull.", "tr": "我们就是这样想出了玩家角色 Shade，还有我们的反派 Kestar Bull。", "spk": "S4"}, {"s": 1011.51, "e": 1014.47, "en": "He's one of those characters that you just love to hate.", "tr": "他就是那种让你又爱又恨的角色。", "spk": "S4"}, {"s": 1014.47, "e": 1014.99, "en": "Yeah,", "tr": "对，", "spk": "S4"}, {"s": 1015.15, "e": 1020.85, "en": "he really is. And I think the team did a terrific job in describing those characters really quickly.", "tr": "确实是这样。我觉得团队在快速刻画这些角色方面做得非常出色。", "spk": "S3"}, {"s": 1021.17, "e": 1025.13, "en": "You know, so the first time we see Kestar, he's kicking a pit droid.", "tr": "你知道，我们第一次见到 Kestar 的时候，他正在踢一个维修机器人。", "spk": "S3"}, {"s": 1025.23, "e": 1027.95, "en": "And that's just, you just know, that's a bad guy.", "tr": "就那一下，你就知道了，这家伙是个坏人。", "spk": "S3"}, {"s": 1028.17, "e": 1029.35, "en": "Yeah, we don't hurt the droids.", "tr": "对，我们不会伤害机器人的。", "spk": "S3"}, {"s": 1029.55, "e": 1030.47, "en": "We love the droids.", "tr": "我们爱机器人。", "spk": "S3"}, {"s": 1031.43, "e": 1037.03, "en": "The reason we want to tell that sports story and want to have those larger-than-life characters is because it needs to enhance the racing,", "tr": "我们想讲那个体育故事、想塑造那些传奇角色的原因，是因为它需要为赛车增色，", "spk": "S4"}, {"s": 1037.21, "e": 1043.65, "en": "needs to enhance the action, needs to make you care about the people you're smashing into the wall or winning over the line with.", "tr": "需要为动作增色，需要让你在乎那些被你撞到墙上、或者和你一起冲过终点线的人。", "spk": "S4"}, {"s": 1044.01, "e": 1047.35, "en": "So actually, for us, it was less about telling a big,", "tr": "所以实际上，对我们来说，重点不在于讲一个宏大、", "spk": "S4"}, {"s": 1047.35, "e": 1056.13, "en": "grand story and making sure that every race was full of character and full of consequence and full of motivation for you to move that story", "tr": "壮阔的故事，而是要确保每一场比赛都充满角色感、充满后果、充满动机，推动你作为玩家把故事", "spk": "S4"}, {"s": 1056.13, "e": 1056.85, "en": "forward as a player.", "tr": "往前推进。", "spk": "S4"}, {"s": 1056.85, "e": 1060.27, "en": "When thinking about those moments of smashing people into walls,", "tr": "说到把别人撞到墙上这些时刻，", "spk": "S3"}, {"s": 1060.53, "e": 1068.59, "en": "how much of those builds during your runs can players plan in advance and how much is about adapting to the rewards and challenges that appear", "tr": "在你的一局游戏中，玩家能提前规划多少改装，又有多少是要随机应变，去应对一局中出现的奖励和挑战呢？", "spk": "S3"}, {"s": 1068.59, "e": 1071.75, "en": "during a run? Yeah, hitting people into the wall and crashing.", "tr": "对，把人撞到墙上、撞车。", "spk": "S3"}, {"s": 1072.01, "e": 1075.13, "en": "You know, that is an awesome visual spectacle.", "tr": "你知道，那是一种非常棒的视觉奇观。", "spk": "S3"}, {"s": 1075.43, "e": 1077.83, "en": "But importantly, it's consequential.", "tr": "但重要的是，它是有后果的。", "spk": "S3"}, {"s": 1078.15, "e": 1084.53, "en": "You know, that runs-based structure requires meaningful decisions to be making, but actions to also have meaning,", "tr": "你知道，这种一局一局的结构要求你做出有意义的决定，同时也要求行动本身有意义，", "spk": "S3"}, {"s": 1084.71, "e": 1088.03, "en": "and the consequence part of that to be powerful.", "tr": "而且后果这部分要有足够的分量。", "spk": "S3"}, {"s": 1088.35, "e": 1094.93, "en": "So that's the unlock then for you to be thinking about, okay, when I then come to upgrade parts,", "tr": "所以这就是解锁点，让你去思考，好，当我接下来要升级零件、", "spk": "S3"}, {"s": 1095.15, "e": 1100.29, "en": "abilities, and the decisions that I'm making on a run for the events that I'm taking on,", "tr": "能力，以及我在一局中针对要参加的事件所做的决定，", "spk": "S3"}, {"s": 1100.37, "e": 1104.03, "en": "or the parts that I want to chase, or when parts come to me or abilities come to me,", "tr": "或者我想追求的零件，又或者当零件或能力出现在我面前时，", "spk": "S3"}, {"s": 1104.23, "e": 1105.57, "en": "what decisions do I want to make?", "tr": "我想做出什么样的决定？", "spk": "S3"}, {"s": 1105.57, "e": 1112.59, "en": "They are all underpinned by that concept that this may not last, so how do I want to play on this run?", "tr": "它们都建立在这样一个概念之上：这一局可能不会长久，那我想在这一局里怎么打？", "spk": "S3"}, {"s": 1113.05, "e": 1120.37, "en": "Yeah, exactly. You're almost creating a cloud, a possibility space, rather than a specific,", "tr": "对，没错。你几乎是在创造一个云团、一个可能性空间，而不是一个具体的、", "spk": "S4"}, {"s": 1120.65, "e": 1122.33, "en": "I'm going to play this way and I'm going to play that way.", "tr": "“我要这样打，我要那样打”。", "spk": "S4"}, {"s": 1123.27, "e": 1127.95, "en": "So yeah, underpinning it is that intransience, so that means we've got consequence and it really matters,", "tr": "所以对，支撑这一切的就是那种无常感，这意味着我们有后果，而且后果真的很重要，", "spk": "S4"}, {"s": 1128.07, "e": 1131.71, "en": "so those decisions matter. But then there's choices you make at the start of a run,", "tr": "所以那些决定才有分量。但在一局开始时，你也会做出一些选择，", "spk": "S4"}, {"s": 1131.89, "e": 1136.67, "en": "like which vehicle you're going to pick, which racer style you're going to pick, and maybe whichever favors,", "tr": "比如选哪辆车、选哪种赛车风格，也许还有哪些增益，", "spk": "S4"}, {"s": 1136.85, "e": 1138.51, "en": "which kind of give you an intention.", "tr": "这些会给你一个意图。", "spk": "S4"}, {"s": 1138.51, "e": 1144.63, "en": "I'm going to play aggressively, I'm going to play tactically, I'm going to play with lots of energy and tools and abilities.", "tr": "我要打得激进，我要打得有策略，我要带着大量能量、工具和能力来打。", "spk": "S4"}, {"s": 1145.67, "e": 1154.01, "en": "But then there is a cloud of options that appear throughout a run that give you the ability to really hone in on a version of", "tr": "但在一场比赛中，还会出现一大堆选项，让你能够真正专注于某种风格的一个版本，", "spk": "S4"}, {"s": 1154.01, "e": 1161.51, "en": "that style that is particularly powerful if you get the right role or pick the right synergy or get an amazing result in an event.", "tr": "如果你选对了角色、挑对了协同搭配，或者在某个事件里拿到了惊人的结果，这个版本就会特别强大。", "spk": "S4"}, {"s": 1161.81, "e": 1167.69, "en": "We've played loads of racing games that are about collecting lots of things and making numbers go up and I love that.", "tr": "我们玩过很多赛车游戏，都是关于收集一大堆东西、让数字往上涨的，我很喜欢那种。", "spk": "S4"}, {"s": 1167.69, "e": 1175.67, "en": "But I feel like that extra consequence and that extra player story that then gets rewarded is what makes this feel really special.", "tr": "但我觉得，那种额外的后果感，以及那种随后得到奖励的额外玩家故事，才是让这款游戏感觉真正特别的地方。", "spk": "S4"}, {"s": 1175.85, "e": 1180.29, "en": "The game also draws on some of the most recognizable imagery in Star Wars.", "tr": "这款游戏还借鉴了《星球大战》中一些最具辨识度的画面。", "spk": "S5"}, {"s": 1180.83, "e": 1185.17, "en": "Can you tell us how different pod racing is from the game's other vehicle types?", "tr": "你能告诉我们，飞梭赛车和游戏里其他载具类型有多大不同吗？", "spk": "S5"}, {"s": 1185.17, "e": 1187.25, "en": "They're in a whole new class of their own.", "tr": "它们自成一类，完全是全新的。", "spk": "S4"}, {"s": 1187.41, "e": 1189.85, "en": "I mean, you can't have a Star Wars racing game without pod races in it.", "tr": "我的意思是，一款《星球大战》赛车游戏里不能没有飞梭赛车。", "spk": "S4"}, {"s": 1189.99, "e": 1193.85, "en": "They're the pinnacle of speed, they're the pinnacle of danger, they're the pinnacle of action.", "tr": "它们是速度的巅峰，是危险的巅峰，是动作感的巅峰。", "spk": "S4"}, {"s": 1193.97, "e": 1197.75, "en": "So they have for the most part their own special tracks.", "tr": "所以它们大多有自己专属的特殊赛道。", "spk": "S4"}, {"s": 1197.75, "e": 1197.93, "en": "would be right for the guns… Okay, that'll work for the next one to add the track design product.", "tr": "对枪械来说应该合适……好，那下一个加赛道设计产品也能用。", "spk": "S4"}, {"s": 1197.95, "e": 1205.01, "en": "their own special conditions. Because they're so much faster and more fragile and more extreme, they require slightly different", "tr": "它们有自己专属的特殊条件。因为它们快得多、脆弱得多、也极端得多，所以它们需要稍微不同的", "spk": "S4"}, {"s": 1205.01, "e": 1206.57, "en": "conditions to be able to race.", "tr": "条件才能进行比赛。", "spk": "S3"}, {"s": 1206.75, "e": 1208.61, "en": "They had to make an appearance in this game.", "tr": "它们必须在这款游戏里登场。", "spk": "S3"}, {"s": 1208.91, "e": 1212.69, "en": "Baris Pax, the founder of the league, as he says in our interactive prologue, you know,", "tr": "联赛的创始人 Baris Pax，就像他在我们的互动序章里说的，", "spk": "S3"}, {"s": 1212.75, "e": 1216.05, "en": "they may be the ultimate racing form but hardly anyone in the galaxy can fly them.", "tr": "它们也许是终极的赛车形态，但银河系里几乎没人能驾驶它们。", "spk": "S3"}, {"s": 1216.49, "e": 1225.41, "en": "And actually that starting point is really important because what we're doing here with the Galactic Leagues is we are broadening the opportunity of racing inside", "tr": "而实际上，这个起点非常重要，因为我们在这里通过银河联赛所做的，是拓宽《星球大战》宇宙中赛车的机会。", "spk": "S3"}, {"s": 1225.41, "e": 1229.53, "en": "Star Wars. And we've already shown in this game how fast racing in Star Wars is.", "tr": "而且我们已经在这款游戏里展示了《星球大战》里的赛车能有多快。", "spk": "S3"}, {"s": 1229.79, "e": 1231.53, "en": "What we've shown so far is as slow as it gets.", "tr": "我们目前展示的，其实是最慢的程度。", "spk": "S3"}, {"s": 1231.67, "e": 1240.25, "en": "On the higher level, once they've been fully upgraded, I think they are around three to four times faster than everything else in the game.", "tr": "在更高层级上，一旦它们完全升级，我觉得它们的速度大约是游戏里其他所有东西的三到四倍。", "spk": "S4"}, {"s": 1240.43, "e": 1242.93, "en": "But I feel like that's important for an arcade racer, right?", "tr": "但我觉得这对一款街机赛车游戏来说很重要，对吧？", "spk": "S4"}, {"s": 1243.01, "e": 1245.73, "en": "You always have that thing where you start and you're like, wow, this feels fast.", "tr": "你总是会有那种感觉：一开始你会想，哇，这感觉好快。", "spk": "S4"}, {"s": 1245.79, "e": 1247.73, "en": "And then you get to the mid and you're like, wow, this feels fast.", "tr": "然后到了中期，你又想，哇，这感觉好快。", "spk": "S4"}, {"s": 1247.89, "e": 1250.01, "en": "And by the end, it's like a completely different game.", "tr": "到最后，它就像一款完全不同的游戏了。", "spk": "S4"}, {"s": 1250.05, "e": 1251.87, "en": "But in this one, you're now in pod races.", "tr": "但在这款游戏里，你现在是在开飞梭赛车。", "spk": "S4"}, {"s": 1252.11, "e": 1257.75, "en": "Yes. So you have four different modes within the game, each of them offering a very different experience.", "tr": "对。所以游戏里有四种不同的模式，每一种都提供非常不同的体验。", "spk": "S3"}, {"s": 1258.03, "e": 1259.75, "en": "What role does each of those play?", "tr": "它们各自扮演什么角色？", "spk": "S3"}, {"s": 1259.75, "e": 1264.53, "en": "And how does what you learn in one mode perhaps influence the way you might approach the others?", "tr": "你在一个模式里学到的东西，又会怎样影响你接触其他模式的方式？", "spk": "S3"}, {"s": 1264.53, "e": 1265.11, "en": "We", "tr": "我们", "spk": "S3"}, {"s": 1265.11, "e": 1270.95, "en": "designed each one of those modes to give a kind of uniquely different experience, depending on the mood that you have at the time,", "tr": "设计这每一个模式，都是为了提供一种独特的、不同的体验，取决于你当时的心情，", "spk": "S4"}, {"s": 1271.03, "e": 1272.35, "en": "but also how much time you have.", "tr": "也取决于你有多少时间。", "spk": "S4"}, {"s": 1272.95, "e": 1277.95, "en": "So obviously the campaign mode is our big full fat mode with Shade's journey through the league,", "tr": "所以很明显，战役模式是我们那种大而全的完整模式，讲的是 Shade 在联赛中的旅程，", "spk": "S4"}, {"s": 1278.15, "e": 1283.69, "en": "telling that story, but also the kind of core of that runs based replayability and build system.", "tr": "讲述那个故事，同时也是那种以单局为基础的可重复游玩性和构筑系统的核心。", "spk": "S4"}, {"s": 1283.69, "e": 1290.75, "en": "But then on top of that, we wanted to showcase the different builds that you can make and the different ways you can play the game.", "tr": "但除此之外，我们还想展示你能做出的不同构筑，以及你可以用不同方式玩这款游戏。", "spk": "S4"}, {"s": 1290.89, "e": 1296.95, "en": "And that really lives in the scenarios mode, which is a character based mode, but is also a much narrower build space.", "tr": "而这真正体现在情景模式里，那是一个以角色为基础的模式，但构筑空间也窄得多。", "spk": "S4"}, {"s": 1296.95, "e": 1304.37, "en": "So it's a character's racing style and then a set of abilities and parts that really synergize with that.", "tr": "所以它是一个角色的赛车风格，再加上一组与之真正协同的能力和部件。", "spk": "S4"}, {"s": 1304.53, "e": 1307.09, "en": "So you can make some really extreme builds in there.", "tr": "所以你可以在里面做出一些非常极端的构筑。", "spk": "S4"}, {"s": 1307.09, "e": 1309.25, "en": "And the idea is if you practice in that mode,", "tr": "这个想法是，如果你在那个模式里练习，", "spk": "S4"}, {"s": 1309.29, "e": 1313.03, "en": "you get an idea of just what that build system has to offer from an extreme point of view.", "tr": "你就能从极端的角度了解那个构筑系统到底能提供什么。", "spk": "S4"}, {"s": 1313.45, "e": 1317.33, "en": "Then there's the Arcade mode, which is very much somewhere where you can have a fixed build,", "tr": "然后是街机模式，那基本上就是你可以用固定构筑的地方，", "spk": "S4"}, {"s": 1317.33, "e": 1322.07, "en": "you can set a time, compare that time with your friends and get in and play as quickly as possible.", "tr": "你可以设定一个时间，和朋友比较那个时间，然后尽快进去玩。", "spk": "S4"}, {"s": 1322.27, "e": 1327.23, "en": "And then obviously the synchronous multiplayer stuff where we've got both in speeders and in pod races,", "tr": "然后显然还有同步多人模式，我们既有飞梭摩托也有飞梭赛车，", "spk": "S4"}, {"s": 1327.49, "e": 1332.59, "en": "that long form league structure, which is kind of like half an hour to 40 minutes of play.", "tr": "那种长线联赛结构，大概就是半小时到四十分钟的游戏时长。", "spk": "S4"}, {"s": 1332.79, "e": 1337.29, "en": "But also if you just want to get in and play with some friends and have some fixed build,", "tr": "但如果你只是想进来跟朋友玩一玩，用固定的配置，", "spk": "S4"}, {"s": 1337.49, "e": 1339.89, "en": "there's quick race as well, both in pod races and speeders.", "tr": "那还有快速比赛，飞梭赛车和飞梭摩托都有。", "spk": "S4"}, {"s": 1340.45, "e": 1347.61, "en": "When you're looking at that multiplayer and tournament structure, those tournament formats historically can be very difficult to balance.", "tr": "当你看那个多人模式和锦标赛结构时，那些锦标赛赛制历来都很难平衡。", "spk": "S3"}, {"s": 1347.83, "e": 1353.59, "en": "You know, if you perform poorly early on, you're likely to feel very deflated, maybe even just like quit out,", "tr": "你知道，如果你一开始表现很差，你很可能会觉得很泄气，甚至可能直接退出，", "spk": "S3"}, {"s": 1353.67, "e": 1358.79, "en": "leave the lobby. How did you as a team approach solving that problem with your multiplayer structure?", "tr": "离开大厅。你们团队是怎么解决多人模式结构里这个问题的？", "spk": "S3"}, {"s": 1358.91, "e": 1363.75, "en": "Because it, you know, in my opinion, it's absolutely fantastic and it really keeps you locked in all the way to the end,", "tr": "因为，你知道，在我看来，这做得非常棒，它真的能让你一直投入到最后，", "spk": "S3"}, {"s": 1363.91, "e": 1366.37, "en": "regardless of how poorly, like myself, you may perform.", "tr": "不管你表现得多差，就像我一样。", "spk": "S3"}, {"s": 1366.37, "e": 1367.01, "en": "I", "tr": "我", "spk": "S3"}, {"s": 1367.01, "e": 1369.51, "en": "think the key to that is that there's always a chance.", "tr": "觉得关键在于，总有机会。", "spk": "S4"}, {"s": 1369.69, "e": 1375.05, "en": "So we completely flipped that paradigm on its head and meant that the only race that really,", "tr": "所以我们完全颠覆了那个模式，意味着唯一真正，", "spk": "S4"}, {"s": 1375.23, "e": 1380.65, "en": "really makes everything is the final race and everything before that final race is a build phase.", "tr": "真正决定一切的比赛就是最后一场，而最后一场之前的一切都是建造阶段。", "spk": "S4"}, {"s": 1380.77, "e": 1385.27, "en": "So it's about trying to get the best results to try and get the best chance to get the right synergy of parts,", "tr": "所以就是要努力取得最好的成绩，争取最好的机会，拿到合适的零件协同，", "spk": "S4"}, {"s": 1385.41, "e": 1386.91, "en": "to get the right upgrades that you need.", "tr": "拿到你需要的正确升级。", "spk": "S4"}, {"s": 1386.91, "e": 1389.95, "en": "But that means at any point in that build phase,", "tr": "但这也意味着在那个建造阶段的任何时候，", "spk": "S4"}, {"s": 1390.15, "e": 1395.19, "en": "you might find the missing piece that will make you the most competitive person on that grid.", "tr": "你可能会找到那块缺失的拼图，让你成为赛道上最有竞争力的人。", "spk": "S4"}, {"s": 1395.39, "e": 1400.71, "en": "And not only that, anything can happen in the final race, a bad corner, a good shunt,", "tr": "不仅如此，最后一场比赛里什么都可能发生，一个糟糕的弯道，一次漂亮的撞击，", "spk": "S4"}, {"s": 1401.01, "e": 1403.97, "en": "a cheeky play, and you're able to come out on top.", "tr": "一个狡猾的操作，你就能脱颖而出。", "spk": "S4"}, {"s": 1404.13, "e": 1411.97, "en": "So I think bringing everything to that final crescendo and making sure that anything could happen in that final crescendo is how you stop those feelings", "tr": "所以我觉得，把所有东西都推向最后那个高潮，并确保在那个高潮里什么都可能发生，这就是你如何阻止那种感觉，", "spk": "S4"}, {"s": 1411.97, "e": 1415.61, "en": "of, wow, there's no point in competing anymore because there's always a chance to win.", "tr": "那种“哇，再比下去也没意义了”的感觉，因为总有机会赢。", "spk": "S4"}, {"s": 1415.61, "e": 1418.13, "en": "Yeah, it's great. I love it.", "tr": "对，太棒了。我很喜欢。", "spk": "S3"}, {"s": 1418.19, "e": 1423.61, "en": "I think the team's done a sensational job of solving that problem, but building to an epic showdown,", "tr": "我觉得团队在解决那个问题上做得非常出色，但同时又构建出一场史诗级的对决，", "spk": "S4"}, {"s": 1423.75, "e": 1427.91, "en": "which mirrors actually the runs-based single structure inside the campaign.", "tr": "这其实也呼应了战役里那种以跑局为基础的单人结构。", "spk": "S4"}, {"s": 1427.91, "e": 1429.43, "en": "It just compresses it down.", "tr": "只是把它压缩了。", "spk": "S4"}, {"s": 1429.75, "e": 1432.81, "en": "into this highly concentrated chunk of action.", "tr": "压缩成这一块高度浓缩的动作。", "spk": "S4"}, {"s": 1433.03, "e": 1439.55, "en": "What they've also done is they've layered in this wonderful sort of, I guess, dark underbelly of Star Wars that exists with,", "tr": "他们还做的是，加入了那种美妙的，我猜是《星球大战》里存在的黑暗底层，", "spk": "S4"}, {"s": 1439.71, "e": 1443.55, "en": "you know, the aspects of criminality, and of syndicates and gambling.", "tr": "你知道，犯罪、辛迪加和赌博的那些方面。", "spk": "S4"}, {"s": 1443.85, "e": 1452.61, "en": "And so that sort of comes into it because I get to predict my finished position in the build phase.", "tr": "所以那种东西就进来了，因为我可以在建造阶段预测我的最终名次。", "spk": "S4"}, {"s": 1452.61, "e": 1456.25, "en": "And that determines the quality of rewards that come in my way.", "tr": "而这决定了我能得到的奖励质量。", "spk": "S4"}, {"s": 1456.43, "e": 1461.15, "en": "So when you come to multiplayer races, you don't necessarily know the relative skill levels.", "tr": "所以当你进入多人比赛时，你不一定知道相对的技术水平。", "spk": "S4"}, {"s": 1461.29, "e": 1464.37, "en": "They start to reveal themselves quite early.", "tr": "它们会很快显现出来。", "spk": "S4"}, {"s": 1464.59, "e": 1466.35, "en": "You get to start to track people,", "tr": "你可以开始追踪别人，", "spk": "S4"}, {"s": 1466.49, "e": 1471.71, "en": "you get to mark people out as rivals that I want to be interested in competing as we go through this build phase.", "tr": "你可以把人标记为对手，在建造阶段进行时我想跟他们竞争。", "spk": "S4"}, {"s": 1472.01, "e": 1480.69, "en": "And on that final showdown event where we've all created the best vehicle build that we possibly can out of our achievements on the first five", "tr": "而在最后那场对决中，我们都在前五场", "spk": "S4"}, {"s": 1480.69, "e": 1483.63, "en": "races, that final event, we then get to bet on the winner.", "tr": "比赛中根据自己的成就造出了最好的载具配置，然后最后那场，我们就可以赌谁赢。", "spk": "S4"}, {"s": 1483.79, "e": 1488.05, "en": "And that is a wonderful moment of introspection to your own capabilities.", "tr": "那是一个绝妙的自我审视时刻，审视你自己的能力。", "spk": "S4"}, {"s": 1488.05, "e": 1490.15, "en": "How much are you? How much are you going to back yourself?", "tr": "你有多？你有多愿意押注自己？", "spk": "S4"}, {"s": 1490.43, "e": 1495.27, "en": "And it gives us that whole sort of sports feeling wrapped up inside a, you know,", "tr": "它给了我们那种完整的体育感觉，包裹在一个，你知道，", "spk": "S4"}, {"s": 1495.35, "e": 1502.41, "en": "25 to 30 minute high intensity experience that is building that crescendo of excitement and emotion.", "tr": "二十五到三十分钟的高强度体验里，不断推向兴奋和情绪的高潮。", "spk": "S4"}, {"s": 1502.55, "e": 1506.45, "en": "It's a terrific, it's a terrific execution of racing, online racing.", "tr": "这赛车做得太棒了，这线上竞速做得太棒了。", "spk": "S4"}, {"s": 1506.57, "e": 1510.09, "en": "Those risk reward mechanics and those rival mechanics are so fun.", "tr": "那些风险回报机制，还有那些对手机制，太好玩了。", "spk": "S4"}, {"s": 1510.17, "e": 1516.17, "en": "One of my personal favorite uses of it was realizing how poorly I was doing during a tournament and thinking,", "tr": "我个人最喜欢的一个用法，就是意识到自己在一场比赛里打得多烂，然后想，", "spk": "S4"}, {"s": 1516.31, "e": 1518.03, "en": "okay, how can I capitalize on this?", "tr": "好吧，我怎么才能利用这一点？", "spk": "S4"}, {"s": 1518.05, "e": 1520.83, "en": "For the most experience possible. I'm not going to win this thing.", "tr": "为了拿到尽可能多的经验。反正我赢不了这局。", "spk": "S4"}, {"s": 1521.53, "e": 1521.89, "en": "I'm not going to win this thing.", "tr": "反正我赢不了这局。", "spk": "S4"}, {"s": 1521.89, "e": 1522.95, "en": "I think this guy's going to win.", "tr": "我觉得这家伙会赢。", "spk": "S4"}, {"s": 1523.09, "e": 1524.79, "en": "So I'm going to mark them as my rival.", "tr": "那我就把他标记成我的对手。", "spk": "S4"}, {"s": 1524.89, "e": 1527.83, "en": "So during the race, I can see them on the track and then I can protect them.", "tr": "这样比赛的时候，我能在赛道上看到他，然后我就能保护他。", "spk": "S4"}, {"s": 1530.53, "e": 1532.81, "en": "That's a great strategy. Yeah, it's a great story.", "tr": "这策略太棒了。对，这故事真好。", "spk": "S4"}, {"s": 1532.99, "e": 1538.13, "en": "And, you know, as Kieran said earlier on, this game is a player story generator is,", "tr": "而且，就像 Kieran 之前说的，这游戏是个玩家故事生成器，", "spk": "S4"}, {"s": 1538.23, "e": 1545.55, "en": "it's unusual to have that inside a racing game, you know, because many, many of the times our racing experiences look the same.", "tr": "在一款赛车游戏里能有这个，挺不寻常的，你知道，因为很多时候我们的赛车体验看起来都一个样。", "spk": "S4"}, {"s": 1545.85, "e": 1548.15, "en": "And they certainly don't in multiplayer on this thing.", "tr": "而在这游戏的多人模式里，那绝对不一样。", "spk": "S4"}, {"s": 1548.29, "e": 1551.83, "en": "We have the concept of status effects that affect the vehicle,", "tr": "我们有个状态效果的概念，会影响载具，", "spk": "S4"}, {"s": 1551.97, "e": 1558.97, "en": "that's the environmental condition or collisions or impacts leads to the vehicle being under a particular status effect being applied to it.", "tr": "就是环境状况、碰撞或者撞击会让载具处于某种特定的状态效果之下。", "spk": "S4"}, {"s": 1559.05, "e": 1563.43, "en": "And one of those is a system malfunction, which happens when someone hits you, you go into a vulnerable state,", "tr": "其中一个就是系统故障，当有人撞到你，你就进入脆弱状态，", "spk": "S4"}, {"s": 1563.53, "e": 1568.45, "en": "you have a system malfunction. Now some of our parts activate when you're in a system malfunction.", "tr": "你就系统故障了。我们有些零件会在你系统故障时激活。", "spk": "S4"}, {"s": 1568.65, "e": 1573.65, "en": "So it might make, for example, my afterburner is 50 % more powerful than a system malfunction.", "tr": "比如说，我的加力燃烧器在系统故障时威力会提升 50%。", "spk": "S4"}, {"s": 1573.65, "e": 1582.51, "en": "And so what that leads to is a behavior where someone is deliberately putting themselves into a system malfunction to get the afterburner to go faster.", "tr": "所以这就导致了一种行为，有人会故意让自己进入系统故障，好让加力燃烧器跑得更快。", "spk": "S4"}, {"s": 1582.65, "e": 1585.43, "en": "So this person was hitting the wall to go faster.", "tr": "所以这家伙是故意撞墙来提速的。", "spk": "S4"}, {"s": 1585.59, "e": 1589.71, "en": "And that is brilliant. I've never heard that in a racing game before.", "tr": "这太绝了。我在赛车游戏里从没听过这种玩法。", "spk": "S4"}, {"s": 1589.93, "e": 1592.13, "en": "It's completely subverting a bunch of convention.", "tr": "它完全颠覆了一堆常规。", "spk": "S4"}, {"s": 1592.15, "e": 1597.39, "en": "And it's all triggered by these wonderful parts that the team have designed, that when they combine together,", "tr": "而这一切都是由团队设计的那些绝妙零件触发的，当它们组合在一起时，", "spk": "S4"}, {"s": 1597.57, "e": 1599.35, "en": "they get you to do different things.", "tr": "就会让你做出不一样的事情。", "spk": "S4"}, {"s": 1599.53, "e": 1601.47, "en": "They synergize with each other in a different way.", "tr": "它们会以不同的方式相互协同。", "spk": "S4"}, {"s": 1601.47, "e": 1603.79, "en": "And there's over 300 of them in the game.", "tr": "游戏里有超过 300 个这样的零件。", "spk": "S4"}, {"s": 1604.01, "e": 1608.05, "en": "Coupled with the abilities and the racer styles and the favors, we've got a vehicle build then,", "tr": "再加上能力、车手风格和恩惠，我们就有了载具构筑，", "spk": "S4"}, {"s": 1608.21, "e": 1610.65, "en": "which I don't think we've seen all the combinations yet.", "tr": "我觉得我们还没见过所有的组合。", "spk": "S4"}, {"s": 1610.71, "e": 1611.27, "en": "There's trillions.", "tr": "有上万亿种。", "spk": "S4"}, {"s": 1611.75, "e": 1613.45, "en": "We literally can't see them all.", "tr": "我们真的不可能全看遍。", "spk": "S4"}, {"s": 1613.49, "e": 1615.05, "en": "I can't wait to see what players make.", "tr": "我迫不及待想看看玩家们会做出什么。", "spk": "S4"}, {"s": 1615.33, "e": 1623.83, "en": "Across the world's characters, builds, modes, every element of the game, what are you two individually most excited for players to discover?", "tr": "从全世界的角色、构筑、模式，到游戏的每一个元素，你们两位各自最期待玩家发现什么？", "spk": "S3"}, {"s": 1623.83, "e": 1625.99, "en": "I can't wait to hear the stories about the builds.", "tr": "我迫不及待想听那些关于构筑的故事。", "spk": "S3"}, {"s": 1626.13, "e": 1631.03, "en": "And in particular, the parts. There is a part for me, which is called Hail Mary.", "tr": "尤其是零件。对我来说有个零件，叫 Hail Mary。", "spk": "S3"}, {"s": 1631.33, "e": 1633.41, "en": "So if I run my ramjet too long, it overheats.", "tr": "如果我冲压发动机开太久，它就会过热。", "spk": "S3"}, {"s": 1633.43, "e": 1634.43, "en": "It hits into the red line.", "tr": "它会冲到红线。", "spk": "S3"}, {"s": 1634.57, "e": 1638.51, "en": "If I spend too long in the red line, it explodes and destroys your craft.", "tr": "如果我在红线待太久，它就会爆炸，把你的飞行器毁掉。", "spk": "S3"}, {"s": 1638.93, "e": 1642.53, "en": "The Hail Mary part gives you a chance that that doesn't happen.", "tr": "Hail Mary 这个零件能给你一个机会，让那事不发生。", "spk": "S3"}, {"s": 1642.53, "e": 1644.85, "en": "And it's led to, for me personally,", "tr": "对我来说，它带来了，", "spk": "S3"}, {"s": 1645.23, "e": 1653.87, "en": "it's led to incredible moments in multiplayer where I know that I'm running that risk of holding that button for too long and just praying that", "tr": "它带来了多人模式里那些不可思议的时刻，我知道自己冒着一直按着那个键的风险，就祈祷着", "spk": "S3"}, {"s": 1653.87, "e": 1657.17, "en": "it doesn't explode. And when it does, I have a moment.", "tr": "它别爆炸。而当它真炸了，我就有那么一刻。", "spk": "S3"}, {"s": 1657.19, "e": 1658.53, "en": "And when it doesn't, I feel amazing.", "tr": "而当它没爆炸的时候，我感觉特别棒。", "spk": "S3"}, {"s": 1658.79, "e": 1662.33, "en": "So it's those sorts of stories that I'm interested in players talking about.", "tr": "所以就是这类故事，我特别想听到玩家们聊起。", "spk": "S3"}, {"s": 1662.33, "e": 1664.31, "en": "Yeah, for me, it's really about.", "tr": "对，对我来说，真的就是。", "spk": "S4"}, {"s": 1664.65, "e": 1671.33, "en": "The fundamentals, because we can talk about game feel and arcade racer and all those kind of things,", "tr": "那些基本功，因为我们可以聊游戏手感、街机赛车之类的，", "spk": "S4"}, {"s": 1671.51, "e": 1676.55, "en": "but until you pick up the pad and feel how fun it is to throw a vehicle around any of the tracks in any of the", "tr": "但直到你拿起手柄，感受到在任何赛道上、开着任何载具甩来甩去有多好玩，", "spk": "S4"}, {"s": 1676.55, "e": 1680.89, "en": "vehicles, you don't really get that sense of love that we've put into that.", "tr": "你才能真正体会到我们倾注其中的那份热爱。", "spk": "S4"}, {"s": 1681.03, "e": 1683.55, "en": "I mean, that's something that we've crafted over years and years of games,", "tr": "我是说，那是我们经过多年、一代代游戏打磨出来的东西，", "spk": "S4"}, {"s": 1683.67, "e": 1689.57, "en": "and it's the thing I love the most about the genre is just throwing a bit of metal around the screen in a way that feels", "tr": "而这也是我最爱这个类型的地方，就是在屏幕上甩着一块金属，", "spk": "S4"}, {"s": 1689.57, "e": 1692.01, "en": "incredibly satisfying as soon as you pick up the pad.", "tr": "那种感觉，你一拿起手柄就无比满足。", "spk": "S4"}, {"s": 1692.01, "e": 1695.91, "en": "So I'm hoping that's going to be reflected with players as soon as they pick it up.", "tr": "所以我希望玩家一上手就能感受到这一点。", "spk": "S4"}, {"s": 1696.13, "e": 1701.69, "en": "And then the largest part of that, which is the sense of speed and that journey of speed as you go through the game,", "tr": "而其中最大的一部分，就是速度感，以及你在游戏进程中经历的速度之旅，", "spk": "S4"}, {"s": 1701.85, "e": 1704.07, "en": "it feels incredibly fast when you first pick it up.", "tr": "你刚开始玩的时候，感觉已经快得不得了。", "spk": "S4"}, {"s": 1704.15, "e": 1710.39, "en": "But by the end, t time. Bye. See ya.", "tr": "对。下次见。拜拜。回见。", "spk": "S1"}, {"s": 3031.47, "e": 3031.89, "en": "Bye.", "tr": "拜拜。", "spk": "S1"}]</script>

 var el=e.target.closest?e.target.closest('.cue'):null;if(!el)return;seek(cues[+el.dataset.i].s+0.01);setFollow(true);$('back').classList.remove('show');play()});
// chapters nav
function goCh(k){k=Math.max(0,Math.min(chaps.length-1,k));seek(chaps[k].s+0.01);setFollow(true);$('back').classList.remove('show');play()}
$('prevCh').onclick=function(){var t=au.currentTime,k=findCh(t);if(t-chaps[k].s>3)goCh(k);else goCh(k-1)};
$('nextCh').onclick=function(){goCh(findCh(au.currentTime)+1)};
function openSheet(){body.classList.add('sheet-open');var c=cis[curCh];if(c){var cl=$('clist');cl.scrollTop=c.offsetTop-cl.clientHeight/2+c.offsetHeight/2}}
function closeSheet(){body.classList.remove('sheet-open')}
$('chapRow').onclick=openSheet;$('sheetBg').onclick=closeSheet;$('sheetX').onclick=closeSheet;
$('clist').onclick=function(e){var r=e.target.closest('.ci');if(!r)return;goCh(+r.dataset.ch);setTimeout(closeSheet,180)};
// player
function play(){if(!au.src){pendingPlay=true;return}var p=au.play();if(p&&p.catch)p.catch(function(){})}
var pendingPlay=false;
$('play').onclick=function(){au.paused?play():au.pause()};
$('b15').onclick=function(){seek(au.currentTime-15)};$('f30').onclick=function(){seek(au.currentTime+30)};
function seek(t){t=Math.max(0,Math.min(dur()-0.2,t));try{au.currentTime=t}catch(e){}pendingSeek=t;update(true)}
var pendingSeek=null;
function curT(){return au.src&&au.readyState>0?au.currentTime:(pendingSeek!=null?pendingSeek:(+st.pos||0))}
var PI_PLAY='M8 5v14l11-7z',PI_PAUSE='M6 19h4V5H6v14zm8-14v14h4V5h-4z';
function setIcon(){$('pi').firstChild.setAttribute('d',au.paused?PI_PLAY:PI_PAUSE);body.classList.toggle('paused',au.paused)}
au.addEventListener('play',setIcon);au.addEventListener('pause',function(){setIcon();st.pos=au.currentTime;save()});
var dragging=false,lastSave=0;
function update(instant){var t=curT(),d=dur();
 if(!dragging){paintBar(t);$('el').textContent=fmt(t);$('rem').textContent='-'+fmt(d-t)}
 setCh(findCh(t));setCur(find(t),instant===true);
 var now=Date.now();if(au.src&&au.readyState>0&&now-lastSave>2000){lastSave=now;st.pos=t;save()}}
au.addEventListener('timeupdate',function(){update(false)});au.addEventListener('seeked',function(){update(false)});
au.addEventListener('ratechange',function(){if(au.playbackRate!==rate)au.playbackRate=rate});
(function tick(){if(!au.paused)update(false);setTimeout(tick,250)})();
// scrubber with chapter tooltip
var bar=$('bar');
function posFromEvt(e){var r=bar.getBoundingClientRect();var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;return Math.max(0,Math.min(1,x/r.width))}
function dragMove(e){var p=posFromEvt(e),t=p*dur(),k=findCh(t);paintBar(t);$('el').textContent=fmt(t);$('rem').textContent='-'+fmt(dur()-t);bar._p=p;
 var tip=$('tip');tip.innerHTML=esc(chaps[k].tr)+' · '+esc(chaps[k].en)+'<small>'+fmt(t)+'</small>';var w=tip.offsetWidth,bw=bar.offsetWidth,x=Math.max(w/2,Math.min(bw-w/2,p*bw));tip.style.left=x+'px';if(e.cancelable)e.preventDefault()}
function dragEnd(){if(!dragging)return;dragging=false;bar.classList.remove('drag');seek(bar._p*dur());setFollow(true);$('back').classList.remove('show');window.removeEventListener('pointermove',dragMove);window.removeEventListener('pointerup',dragEnd)}
bar.addEventListener('pointerdown',function(e){dragging=true;bar.classList.add('drag');dragMove(e);window.addEventListener('pointermove',dragMove);window.addEventListener('pointerup',dragEnd)});
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();au.paused?play():au.pause()}else if(e.code==='ArrowLeft')seek(au.currentTime-5);else if(e.code==='ArrowRight')seek(au.currentTime+5)});
if('mediaSession' in navigator){try{navigator.mediaSession.setActionHandler('play',play);navigator.mediaSession.setActionHandler('pause',function(){au.pause()});
 navigator.mediaSession.setActionHandler('seekbackward',function(){seek(au.currentTime-15)});navigator.mediaSession.setActionHandler('seekforward',function(){seek(au.currentTime+30)});
 navigator.mediaSession.setActionHandler('previoustrack',function(){$('prevCh').onclick()});navigator.mediaSession.setActionHandler('nexttrack',function(){$('nextCh').onclick()});
 try{navigator.mediaSession.setActionHandler('seekto',function(d){seek(d.seekTime)})}catch(e){}}catch(e){}}
window.addEventListener('pagehide',function(){if(au.readyState>0){st.pos=au.currentTime;save()}});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(au.readyState>0){st.pos=au.currentTime;save()}}else recenter(true)});
window.addEventListener('resize',function(){setPH();recenter(true)});
// initial render before audio
setPH();update(true);
// audio source
function status(msg){var s=$('status');s.textContent=msg||'';s.classList.toggle('show',!!msg);setPH()}
function attach(src){au.src=src;au.load();var restore=+st.pos||0;
 au.addEventListener('loadedmetadata',function(){var t=pendingSeek!=null?pendingSeek:restore;if(t>1){try{au.currentTime=t}catch(e){}}update(true);if(pendingPlay){pendingPlay=false;play()}},{once:true});
 au.addEventListener('error',function(){status(U('loadFail'))},{once:true});
 window.__playerReady=true}
if(CFG.audio==='embed'){
 var b64el=$('b64');status(U('preparing',0));
 setTimeout(function(){try{
  var s=b64el.textContent,CH=524288,pos=0,parts=[],n=s.length;
  (function step(){var end=Math.min(n,pos+CH);var chunk=s.substring(pos,end).replace(/[^A-Za-z0-9+\/=]/g,'');
   var bin=atob(chunk),u=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);parts.push(u);pos=end;
   if(pos<n){status(U('preparing',Math.round(pos/n*100)));setTimeout(step,0)}
   else{var blob=new Blob(parts,{type:'audio/mpeg'});window.__audioBytes=blob.size;b64el.textContent='';s=null;attach(URL.createObjectURL(blob));status('')}})();
 }catch(err){console.error(err);status(U('decodeFail'))}},30);
}else{attach(CFG.audioUrl)}
})();
