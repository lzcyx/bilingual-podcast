# Providers are tried in order (first success wins).
# Base URLs and API keys come from environment variables / GitHub Secrets.
# Do not put private base URLs here.
providers:
  - name: gpt
    model: gpt-6.1-sol
    key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
  - name: deepseek
    model: deepseek-flash
    key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
  - name: grok
    model: grok-4.7
    key_env: XAI_API_KEY
    base_url_env: XAI_BASE_URL

temperature: 0.2
# disabled sends thinking.type=disabled and reasoning_effort=none.
thinking: disabled
