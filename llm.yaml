# OpenAI-compatible chat endpoint. Override with DEEPSEEK_BASE_URL / DEEPSEEK_MODEL.
# The API key is NOT stored here — set the DEEPSEEK_API_KEY secret.
base_url: https://api.deepseek.com
model: deepseek-flash
temperature: 0.2
# disabled sends thinking.type=disabled and reasoning_effort=none (no chain-of-thought).
thinking: disabled
# 费用按中国区人民币价估算：deepseek-flash 闲时输入未命中 ¥1、输出 ¥4 / 百万 token，高峰翻倍。
