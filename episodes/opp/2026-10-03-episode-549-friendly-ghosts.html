#shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,12,28,.55) 0%,rgba(8,12,28,.25) 35%,rgba(8,12,28,.45) 70%,rgba(5,8,18,.92) 100%)}
#top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
#top .t{flex:1;min-width:0}
#top .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .t span{display:block;font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:rgba(255,255,255,.9);color:var(--c-base)}
#menu{position:fixed;z-index:30;right:12px;top:calc(var(--safe-t) + 54px);background:rgba(20,24,40,.95);border-radius:14px;padding:8px;display:none;min-width:240px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#menu.show{display:block}
#menu .row{display:flex;align-items:center;justify-content:space-between;padding:9px 8px;font-size:14px;gap:12px}
#menu .seg{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:2px}
#menu .seg button{border:0;background:transparent;color:#fff;padding:5px 10px;border-radius:7px;font-size:13px;cursor:pointer}
#menu .seg button.on{background:rgba(255,255,255,.9);color:var(--c-base);font-weight:700}
#lyrics{position:fixed;inset:0;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
 padding:42vh 22px calc(50vh + var(--safe-b)) 22px;
 -webkit-mask-image:linear-gradient(180deg,transparent 0,transparent calc(var(--safe-t) + 52px),#000 calc(var(--safe-t) + 120px),#000 calc(100% - var(--ph,240px) - 50px),transparent calc(100% - var(--ph,240px) + 10px));
 mask-image:linear-gradient(180deg,transparent 0,transparent calc(var(--safe-t) + 52px),#000 calc(var(--safe-t) + 120px),#000 calc(100% - var(--ph,240px) - 50px),transparent calc(100% - var(--ph,240px) + 10px))}
#lyrics::-webkit-scrollbar{display:none}
.cue{padding:9px 6px;margin:2px 0;border-radius:12px;cursor:pointer;opacity:.34;transform-origin:left center;transition:opacity .35s ease,transform .35s ease}
.cue:active{background:rgba(255,255,255,.08)}
.cue .ts{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums;letter-spacing:.3px;margin-bottom:3px;font-weight:600;display:flex;align-items:center;gap:8px}
.cue .en{font-size:21px;line-height:1.3;font-weight:750;letter-spacing:-.2px}
.cue .zh{font-size:18px;line-height:1.45;font-weight:500;margin-top:4px;opacity:.9}
.cue.past{opacity:.28}
.cue.active{opacity:1;transform:scale(1.04)}
.cue.active .ts{opacity:1}.cue.active .ts .tm{color:var(--accent)}
.chap-h{margin:26px 6px 8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.chap-h .n{font-size:11px;font-weight:800;opacity:.6;letter-spacing:.5px;white-space:nowrap}
.chap-h .z{font-size:15px;font-weight:800}.chap-h .e{font-size:12px;opacity:.6}
body.swap .cue{display:flex;flex-direction:column}
body.swap .cue .zh{order:1;margin-top:0;font-size:21px;font-weight:700;opacity:1}
body.swap .cue .en{order:2;margin-top:4px;font-size:17px;font-weight:600;opacity:.85}
body.m-en .cue .zh{display:none}
body.m-zh .cue .en{display:none}
body.m-zh .cue .zh{font-size:22px;font-weight:700;margin-top:0;opacity:1}
body.big .cue .en{font-size:25px} body.big .cue .zh{font-size:21px}
#back{position:fixed;z-index:6;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--ph,240px) + 14px);opacity:0;pointer-events:none;transition:all .25s ease;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:var(--c-base);font-weight:700;font-size:14px;padding:10px 16px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.45);cursor:pointer}
#back.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:4px 18px calc(10px + var(--safe-b));background:rgba(12,16,30,.74);border-top:1px solid rgba(255,255,255,.08)}
#handle{display:flex;justify-content:center;align-items:center;height:18px;margin:0 auto 2px;width:90px;border:0;background:transparent;cursor:pointer;padding:0}
#handle span{display:block;width:38px;height:5px;border-radius:5px;background:rgba(255,255,255,.35);transition:all .2s}
body.strip-off #handle span{width:22px;height:10px;background:transparent;border:solid rgba(255,255,255,.6);border-width:2.5px 2.5px 0 0;border-radius:2px;transform:rotate(-45deg) translate(-2px,3px)}
#meta{display:flex;align-items:center;gap:12px;overflow:hidden;max-height:70px;transition:max-height .28s ease,opacity .2s ease,margin .28s ease;margin-bottom:8px}
body.strip-off #meta{max-height:0;opacity:0;margin-bottom:0}
#meta img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
#meta .mt{flex:1;min-width:0}
#meta .mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta .mt span{display:block;font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hideStrip{border:0;background:rgba(255,255,255,.12);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none;font-size:15px;line-height:30px;padding:0}
#chapRow{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#fff;width:100%;padding:2px 0;cursor:pointer;text-align:left}
#chapRow .ic{flex:none;width:18px;height:18px;opacity:.85}
#chapRow .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:750}
#chapRow .tx small{font-weight:500;opacity:.6;font-size:12px;margin-left:6px}
#chapRow .ix{flex:none;font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
#bar{margin:8px 0 2px;position:relative;height:22px;touch-action:none;cursor:pointer}
#segs{position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;display:flex;gap:3px}
.sg{height:100%;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;min-width:2px;transition:height .15s,transform .15s}
.sg .sf{height:100%;width:0;background:#fff}
.sg.cur{transform:scaleY(1.35)}
#bar.drag .sg{transform:scaleY(1.6)}
#knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;left:0;box-shadow:0 1px 6px rgba(0,0,0,.4);transition:transform .15s;pointer-events:none}
#bar.drag #knob{transform:scale(1.35)}
#tip{position:absolute;bottom:26px;left:0;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--c-base);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:78vw;overflow:hidden;text-overflow:ellipsis}
#tip small{display:block;font-weight:600;opacity:.6;font-variant-numeric:tabular-nums}
#bar.drag #tip{opacity:1}
#times{display:flex;justify-content:space-between;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
#ctl{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
#ctl button{border:0;background:transparent;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center;min-width:40px}
#ctl svg{width:28px;height:28px;fill:#fff}
#ctl .ch svg{width:24px;height:24px}
#play svg{width:50px;height:50px}
#speed{font-weight:800;font-size:13px;border:1.5px solid rgba(255,255,255,.55)!important;border-radius:8px;padding:3px 5px!important;min-width:44px!important}
#follow{flex-direction:column;font-size:10px;font-weight:700;gap:1px}
#follow svg{width:20px;height:20px}
#follow.off{opacity:.4}
#status{font-size:11px;opacity:.75;text-align:center;margin-top:2px;display:none}
#status.show{display:block}
#sheetBg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78vh;display:flex;flex-direction:column;background:rgba(22,26,44,.97);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
body.sheet-open #sheetBg{opacity:1;pointer-events:auto}
body.sheet-open #sheet{transform:translateY(0)}
#sheet .hd{display:flex;align-items:center;padding:8px 18px 10px;gap:10px}
#sheet .grab{width:38px;height:5px;border-radius:5px;background:rgba(255,255,255,.3);margin:8px auto 2px}
#sheet .hd b{font-size:17px;flex:1}
#sheet .hd span{font-size:12px;opacity:.6}
#sheet .x{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}
#clist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 14px}
.ci{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:12px;cursor:pointer}
.ci:active{background:rgba(255,255,255,.06)}
.ci .no{width:22px;flex:none;text-align:center;font-size:13px;font-weight:800;opacity:.5;font-variant-numeric:tabular-nums}
.ci .bd{flex:1;min-width:0}
.ci .z{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .e{font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ci .tm{flex:none;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;opacity:.75;line-height:1.35}
.ci .tm small{display:block;opacity:.65;font-size:11px}
.ci.cur{background:rgba(255,255,255,.1)}
.ci.cur .no{opacity:1;color:var(--accent)}
.ci.cur .z{color:var(--accent)}
.ci.done .z,.ci.done .e{opacity:.55}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
body.paused .eq i{animation:none;height:5px}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
@media (min-width:760px){#lyrics{padding-left:max(22px,calc(50vw - 360px));padding-right:max(22px,calc(50vw - 360px))}#player{padding-left:max(18px,calc(50vw - 380px));padding-right:max(18px,calc(50vw - 380px))}#sheet{left:calc(50vw - 380px);right:calc(50vw - 380px)}}

/* Dual style (S = Spotify, B = Apple), switched live via body.theme-S / body.theme-B. Theme rules use :where() so
   their specificity equals the base rules they override (same cascade as the old separate templates). Colours
   are injected by build.py. */
body.theme-S{
  --c-base:#206aa7;--c-top:#267fca;--accent:#fff;
  background:var(--c-base);color:#fff;
}
:where(body.theme-S) #shade{background:linear-gradient(180deg,var(--c-top) 0%,var(--c-base) 17%,var(--c-base) 100%)}
:where(body.theme-S) #bg{display:none}
:where(body.theme-S) .chip{background:rgba(0,0,0,.24);backdrop-filter:none;-webkit-backdrop-filter:none}
:where(body.theme-S) .chip.on{background:#fff;color:#000}
:where(body.theme-S) #menu{background:#282828;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
:where(body.theme-S) #menu .seg{background:#3e3e3e}
:where(body.theme-S) #menu .seg button.on{background:#fff;color:#000}
:where(body.theme-S) #top .t span{color:rgba(255,255,255,.75);opacity:1}
:where(body.theme-S) .cue{opacity:1;color:rgba(0,0,0,.55);transform:none}
:where(body.theme-S) .cue .zh,:where(body.theme-S) .cue .en{opacity:1}
:where(body.theme-S) .cue .ts{opacity:.8}
:where(body.theme-S) .cue.past{opacity:1;color:rgba(255,255,255,.65)}
:where(body.theme-S) .cue.active{opacity:1;color:#fff;transform:none}
:where(body.theme-S) .cue.active .ts,:where(body.theme-S) .cue.active .ts .tm{color:#fff;opacity:1}
:where(body.theme-S) .cue .en{font-size:22px;font-weight:800}
:where(body.theme-S) .cue .zh{font-weight:700}
:where(body.theme-S) .cue:active{background:rgba(0,0,0,.1)}
:where(body.theme-S) .chap-h{background:rgba(0,0,0,.2);color:#fff}
:where(body.theme-S) .chap-h .n,:where(body.theme-S) .chap-h .e{color:rgba(255,255,255,.72);opacity:1}
:where(body.theme-S) #back{background:#fff;color:#000;box-shadow:0 4px 12px rgba(0,0,0,.3)}
:where(body.theme-S) #player{background:#121212;backdrop-filter:none;-webkit-backdrop-filter:none;border-top:0;border-radius:16px 16px 0 0}
:where(body.theme-S) #meta .mt span,:where(body.theme-S) #chapRow .ix,:where(body.theme-S) #times{color:#b3b3b3;opacity:1}
:where(body.theme-S) #chapRow .tx small{color:#b3b3b3;opacity:1}
:where(body.theme-S) #handle span{background:#535353}
:where(body.theme-S) #hideStrip{background:#2a2a2a}
:where(body.theme-S) .sg{background:rgba(255,255,255,.3)}
:where(body.theme-S) .sg .sf{background:#fff}
:where(body.theme-S) #knob{box-shadow:none}
:where(body.theme-S) #tip{background:#fff;color:#000;box-shadow:0 4px 12px rgba(0,0,0,.5)}
:where(body.theme-S) #speed{border-color:#7a7a7a!important}
:where(body.theme-S) #play{width:56px;height:56px;min-width:56px!important;border-radius:50%;background:#fff!important;padding:0!important}
:where(body.theme-S) #play svg{width:28px;height:28px;fill:#000}
:where(body.theme-S) #sheetBg{background:rgba(0,0,0,.6)}
:where(body.theme-S) #sheet{background:#282828;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
:where(body.theme-S) #sheet .hd{border-bottom:1px solid #3a3a3a}
:where(body.theme-S) #sheet .hd span{color:#b3b3b3;opacity:1}
:where(body.theme-S) #sheet .grab{background:#5a5a5a}
:where(body.theme-S) #sheet .x{background:#3e3e3e}
:where(body.theme-S) .ci .e,:where(body.theme-S) .ci .tm small{color:#b3b3b3;opacity:1}
:where(body.theme-S) .ci .no{color:#b3b3b3;opacity:1}
:where(body.theme-S) .ci .tm{color:#b3b3b3;opacity:1}
:where(body.theme-S) .ci.cur{background:#333}
:where(body.theme-S) .ci.cur .no,:where(body.theme-S) .ci.cur .z{color:#fff;font-weight:800}
:where(body.theme-S) .eq i{background:#1ed760}
:where(body.theme-S) .ci.done .z{color:#b3b3b3;opacity:1}
:where(body.theme-S) .ci.done .e{color:#8a8a8a;opacity:1}
body.theme-B{
  --c-base:#1b598d;--c-bar:#174d7a;--c-sheet:#185181;--accent:#fff;
  background:var(--c-base);color:#fff;
}
:where(body.theme-B) #shade{display:none}
:where(body.theme-B) #bg{display:none}
:where(body.theme-B) .chip{background:rgba(255,255,255,.16);backdrop-filter:none;-webkit-backdrop-filter:none}
:where(body.theme-B) .chip.on{background:#fff;color:var(--c-base)}
:where(body.theme-B) #menu{background:var(--c-sheet);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
:where(body.theme-B) #menu .seg{background:rgba(255,255,255,.14)}
:where(body.theme-B) #menu .seg button.on{background:#fff;color:var(--c-base)}
:where(body.theme-B) #top .t span,:where(body.theme-B) #meta .mt span,:where(body.theme-B) .chap-h .n,:where(body.theme-B) .chap-h .e,:where(body.theme-B) #chapRow .ix,:where(body.theme-B) #times,:where(body.theme-B) .ci .e,:where(body.theme-B) .ci .tm small,:where(body.theme-B) #sheet .hd span{color:rgba(255,255,255,.62);opacity:1}
:where(body.theme-B) .cue{opacity:.56}
:where(body.theme-B) .cue.past{opacity:.46}
:where(body.theme-B) .cue.active .ts{color:rgba(255,255,255,.7)}
:where(body.theme-B) .cue.active .ts .tm{color:#fff}
:where(body.theme-B) .chap-h{background:rgba(255,255,255,.1)}
:where(body.theme-B) #back{background:#fff;color:var(--c-base);box-shadow:0 4px 12px rgba(0,0,0,.3)}
:where(body.theme-B) #player{background:var(--c-bar);backdrop-filter:none;-webkit-backdrop-filter:none;border-top:0}
:where(body.theme-B) #handle span{background:rgba(255,255,255,.35)}
:where(body.theme-B) #hideStrip{background:rgba(255,255,255,.16)}
:where(body.theme-B) .sg{background:rgba(255,255,255,.26)}
:where(body.theme-B) .sg .sf{background:rgba(255,255,255,.92)}
:where(body.theme-B) #knob{box-shadow:none}
:where(body.theme-B) #tip{background:#fff;color:var(--c-base);box-shadow:0 4px 12px rgba(0,0,0,.3)}
:where(body.theme-B) #speed{border-color:rgba(255,255,255,.5)!important}
:where(body.theme-B) #sheetBg{background:rgba(0,0,0,.4)}
:where(body.theme-B) #sheet{background:var(--c-sheet);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
:where(body.theme-B) #sheet .hd{border-bottom:1px solid rgba(255,255,255,.1)}
:where(body.theme-B) #sheet .grab{background:rgba(255,255,255,.35)}
:where(body.theme-B) #sheet .x{background:rgba(255,255,255,.16)}
:where(body.theme-B) .ci .no{color:rgba(255,255,255,.5);opacity:1}
:where(body.theme-B) .ci .tm{color:rgba(255,255,255,.75);opacity:1}
:where(body.theme-B) .ci.cur{background:rgba(255,255,255,.14)}
:where(body.theme-B) .ci.cur .no,:where(body.theme-B) .ci.cur .z{color:#fff}
:where(body.theme-B) .ci.done .z{color:rgba(255,255,255,.62);opacity:1}
:where(body.theme-B) .ci.done .e{color:rgba(255,255,255,.45);opacity:1}

/* speaker labels: shown at the start of each speaker turn; pill in the speaker colour (works on any cover colour) */
.cue .spk{display:none;margin:2px 0 6px}
body.show-spk .cue.turn-start .spk{display:block}
.cue .spk b{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;letter-spacing:.2px;line-height:1;padding:4px 9px 4px 7px;border-radius:999px;background:var(--spk,#ddd);color:rgba(0,0,0,.8);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cue .spk b:before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.45);flex:none}
:where(body.theme-S) .cue .spk b{opacity:.78}
:where(body.theme-S) .cue.active .spk b,:where(body.theme-S) .cue.past .spk b{opacity:1}
:where(body.theme-B) .cue .spk b{opacity:.92}
body.show-spk .cue.turn-start{margin-top:12px}
</style>

rld by the end of the game, and then shape how your final fight goes.", "tr": "塑造游戏结束时世界的状态，然后塑造你最终战斗的走向。", "spk": "S1"}, {"s": 2216.75, "e": 2219.47, "en": "So my first playthrough, I played it through with that human side.", "tr": "所以我第一周目的时候，我是站在人类那一边玩的。", "spk": "S1"}, {"s": 2219.61, "e": 2223.35, "en": "And I, my final fight was in the daytime, purely as a human, things like that.", "tr": "我，我的最终战斗是在白天进行的，纯粹以人类身份，诸如此类。", "spk": "S1"}, {"s": 2223.57, "e": 2224.93, "en": "Now you're gonna be a menace to humanity.", "tr": "现在你要变成人类的威胁了。", "spk": "S0"}, {"s": 2225.07, "e": 2225.15, "en": "So", "tr": "所以", "spk": "S0"}, {"s": 2225.15, "e": 2227.41, "en": "yeah, so my second playthrough, now I'm like, give me all the blood.", "tr": "对，所以我第二周目的时候，我现在就是，把血都给我。", "spk": "S1"}, {"s": 2227.85, "e": 2234.11, "en": "Like I like, straight shot have just been, not killing people, but like, draining them to the point of falling asleep.", "tr": "我就，直接就是，不是杀人，而是把他们吸到昏睡过去。", "spk": "S1"}, {"s": 2234.11, "e": 2237.31, "en": "And my vampire abilities are like, so much stronger.", "tr": "我的吸血鬼能力就强太多了。", "spk": "S1"}, {"s": 2237.61, "e": 2239.25, "en": "Can you kill them too? You can if you want.", "tr": "你也能杀了他们吗？你想的话可以。", "spk": "S1"}, {"s": 2239.47, "e": 2246.11, "en": "What's, what's, why stop short? Uh, I, for some of them, I don't know if this game gets quite so granular,", "tr": "为什么，为什么，为什么要手下留情呢？呃，我，对某些人来说，我不知道这游戏会不会做得这么细致，", "spk": "S1"}, {"s": 2246.11, "e": 2249.93, "en": "but I know for some characters, like I didn't, maybe don't want to kill a character.", "tr": "但我知道对某些角色，比如我，可能不想杀某个角色。", "spk": "S1"}, {"s": 2250.07, "e": 2252.47, "en": "Like a Skyrim where it's just like, no, that quest giver's dead or something.", "tr": "就像《上古卷轴5：天际》里那样，就是，不行，那个发任务的人死了之类的。", "spk": "S1"}, {"s": 2252.47, "e": 2257.27, "en": "Yeah, it could be something like that, because I have found that there have been quests that I didn't find the first time,", "tr": "对，可能是类似的情况，因为我发现有些任务我第一周目没找到，", "spk": "S1"}, {"s": 2257.27, "e": 2261.17, "en": "or a character was killed. And so that entire quest didn't exist.", "tr": "或者某个角色被杀了。然后整个任务就不存在了。", "spk": "S1"}, {"s": 2261.33, "e": 2264.27, "en": "But in this version, something that I did, they are still alive.", "tr": "但在这个版本里，我做了一些事，他们还活着。", "spk": "S1"}, {"s": 2264.27, "e": 2267.77, "en": "And now this whole other plot line, or like conversation has opened.", "tr": "然后现在这整条别的剧情线，或者说对话就展开了。", "spk": "S1"}, {"s": 2268.15, "e": 2269.79, "en": "Uh, so I just love stuff like that.", "tr": "嗯，所以我就特别喜欢这种东西。", "spk": "S1"}, {"s": 2269.87, "e": 2274.39, "en": "So I'm trying to, I'm trying to do all of the choices I didn't make in the first one.", "tr": "所以我在努力，我在努力把第一次没做的选择全都做一遍。", "spk": "S1"}, {"s": 2274.91, "e": 2276.39, "en": "Now I'm going to do this one.", "tr": "现在我要做这个。", "spk": "S1"}, {"s": 2276.55, "e": 2281.73, "en": "And then on top of that, there are, Brencis has these three, they're called boyars, which are like his ambassadors,", "tr": "然后除此之外，Brencis还有这三个，他们叫boyars，基本上就像是他的大使，", "spk": "S1"}, {"s": 2281.89, "e": 2288.61, "en": "basically. Um, that you can do all of these small side quests that will annoy essentially those three ambassadors.", "tr": "嗯，你可以做所有这些小支线任务，基本上会惹恼那三个大使。", "spk": "S1"}, {"s": 2288.95, "e": 2294.19, "en": "And eventually they'll pick a fight with you and you can potentially pick them off before you get to the final fight with Brencis.", "tr": "最后他们会跟你打一架，你有可能在跟Brencis最终决战之前把他们一个个解决掉。", "spk": "S1"}, {"s": 2294.19, "e": 2294.33, "en": "But uh, let's see the last Bye.", "tr": "不过呃，咱们看看最后的Bye吧。", "spk": "S1"}, {"s": 2294.35, "e": 2297.87, "en": "And if you don't interact with them, they will all be at that final fight and make it tougher.", "tr": "如果你不跟他们互动，他们就会全都出现在最终决战里，让战斗变得更难。", "spk": "S1"}, {"s": 2298.21, "e": 2302.61, "en": "And so the first playthrough, I found two of them, and one of them completely by accident.", "tr": "所以第一次通关的时候，我找到了其中两个，其中一个完全是意外碰到的。", "spk": "S1"}, {"s": 2302.89, "e": 2304.63, "en": "Like, I didn't even do any of her side quests.", "tr": "就是，我甚至都没做她的任何支线任务。", "spk": "S1"}, {"s": 2304.73, "e": 2307.21, "en": "I just found her immediately and fought her.", "tr": "我就直接找到她然后跟她打了。", "spk": "S1"}, {"s": 2307.33, "e": 2309.81, "en": "And I was like, oh, that's kind of cool, too, that it's very...", "tr": "我当时就想，哦，这也挺酷的，就是非常……", "spk": "S1"}, {"s": 2309.81, "e": 2310.49, "en": "They're just out in the world.", "tr": "他们就是直接待在世界里。", "spk": "S1"}, {"s": 2311.47, "e": 2313.43, "en": "Like, you could potentially just have this happen.", "tr": "就是，你有可能就这么碰上这种事。", "spk": "S1"}, {"s": 2313.99, "e": 2320.19, "en": "And then for another one, it's that I did something enough that he, like, someone summoned me to be like,", "tr": "然后另一个呢，是我做了某件事做到一定程度，他就，就像有人召唤我去，说，", "spk": "S1"}, {"s": 2320.23, "e": 2321.61, "en": "I think you can help me take this guy down.", "tr": "我觉得你可以帮我干掉这家伙。", "spk": "S1"}, {"s": 2322.61, "e": 2325.37, "en": "And so I missed one of them in the first playthrough.", "tr": "所以第一次通关的时候我漏掉了其中一个。", "spk": "S1"}, {"s": 2325.51, "e": 2328.11, "en": "And so my second playthrough, I was like, I'm going to piss that guy off the most,", "tr": "所以第二次通关的时候，我就想，我要把那个家伙惹毛到极点，", "spk": "S1"}, {"s": 2328.13, "e": 2333.09, "en": "because I want him... I didn't see what his plot was, so it opened up this whole new branch.", "tr": "因为我想要他……我没看到他的剧情是什么，所以这就开启了整条全新的分支。", "spk": "S1"}, {"s": 2333.25, "e": 2338.81, "en": "So all this to say, what I'm loving about it, so it's from a group of folks who previously worked for CG Project Red.", "tr": "所以说这么多，我想说的是，我喜欢它的一点是，它出自一群之前为CG Project Red工作过的人。", "spk": "S1"}, {"s": 2338.85, "e": 2342.51, "en": "They worked on The Witcher 3, which has its remastered version out this week as well.", "tr": "他们做过《巫师3》，这周它的重制版也出了。", "spk": "S1"}, {"s": 2342.61, "e": 2345.23, "en": "Yeah, it bares its teeth in riches for fans of world RPGs.", "tr": "对，对于世界RPG的粉丝来说，它可是亮出了獠牙，内容很丰富。", "spk": "S1"}, {"s": 2345.27, "e": 2347.23, "en": "Yeah, it bares its teeth in riches. So it has...", "tr": "对，它亮出了獠牙。所以它有……", "spk": "S1"}, {"s": 2347.23, "e": 2349.63, "en": "I see a lot of the bones of The Witcher in it.", "tr": "我在里面看到很多《巫师》的骨架。", "spk": "S1"}, {"s": 2349.63, "e": 2353.91, "en": "And if you enjoy games like that, I think you will very, very much enjoy The Blood of Dawnwalker.", "tr": "如果你喜欢那种游戏，我觉得你会非常非常喜欢《The Blood of Dawnwalker》。", "spk": "S1"}, {"s": 2354.09, "e": 2356.8, "en": "But it has enough mechanics that make it very replayable.", "tr": "但它的机制足够多，让它非常耐玩。", "spk": "S1"}, {"s": 2357.41, "e": 2361.81, "en": "Like, it made me... The first playthrough, I was already thinking through, what am I going to do differently?", "tr": "就是，它让我……第一次通关的时候，我就已经在琢磨，我下次要做什么不一样的？", "spk": "S1"}, {"s": 2362.37, "e": 2367.19, "en": "And because of the time constraints, it makes you a lot more selective of what you're going to do.", "tr": "而且因为时间限制，它会让你对要做什么更加挑剔。", "spk": "S1"}, {"s": 2367.31, "e": 2371.67, "en": "And it's not just like, let me clear this whole map, which is normally how I play an RPG.", "tr": "它不像那种，让我把整张地图清干净，那通常是我玩RPG的方式。", "spk": "S1"}, {"s": 2371.67, "e": 2374.85, "en": "I'm very much of the mind of like, if I see a question mark, I'm taking my time,", "tr": "我特别有那种心态，就是如果我看到一个问号，我会慢慢来，", "spk": "S1"}, {"s": 2374.99, "e": 2376.75, "en": "I'm going in that cave, I'm fighting that thing.", "tr": "我会进那个洞穴，我会打那个东西。", "spk": "S1"}, {"s": 2376.85, "e": 2386.07, "en": "Yeah. Whereas this time, I was much more thoughtful of like, maybe I'll come back, maybe I'll focus on this. have definitely piqued my interest. I like vampires.", "tr": "对。而这次呢，我就想得更多，比如也许我以后再来，也许我专注做这个。这确实勾起了我的兴趣。我喜欢吸血鬼。", "spk": "S1"}, {"s": 2386.45, "e": 2391.25, "en": "I also love vampires. We recently had a watchplay where I watched Interview with a Vampire for the first time.", "tr": "我也喜欢吸血鬼。我们最近有个观看活动，我第一次看了《夜访吸血鬼》。", "spk": "S0"}, {"s": 2391.55, "e": 2395.05, "en": "Yeah. And that's all about a character kind of trying to figure out like, how do I navigate this thing,", "tr": "对。那整个讲的就是一个角色试图搞清楚，我该怎么应对这件事，", "spk": "S0"}, {"s": 2395.17, "e": 2401.17, "en": "right? And, but I have other questions, which is one, does your appearance change depending on how you are?", "tr": "对吧？而且，但我还有别的问题，其中一个就是，你的外貌会根据你的状态改变吗？", "spk": "S0"}, {"s": 2401.17, "e": 2407.33, "en": "So during the day, you look entirely human, because that's sort of the crux of it is that you are this dawn walker,", "tr": "所以白天的时候，你看起来完全像人类，因为关键就在这儿，你是这个黎明行者，", "spk": "S1"}, {"s": 2407.43, "e": 2413.59, "en": "which is a different, sometimes turning someone, part of the lore is that it can go wrong in a multitude of ways.", "tr": "这是一种不同的、有时候会把人转化的东西，设定的一部分就是它可能以多种方式出错。", "spk": "S1"}, {"s": 2413.83, "e": 2417.17, "en": "So it's not necessarily that you will ultimately be a dawn walker if it goes wrong.", "tr": "所以如果出错的话，并不一定你最终会成为黎明行者。", "spk": "S1"}, {"s": 2417.29, "e": 2418.65, "en": "For some of them, it just turns you like.", "tr": "对其中一些人来说，它就只是把你变成……", "spk": "S1"}, {"s": 2418.95, "e": 2421.55, "en": "into this brain-dead monster... Like a ghoul.", "tr": "变成这种没脑子的怪物……就像食尸鬼一样。", "spk": "S1"}, {"s": 2421.55, "e": 2422.69, "en": "A gibbering ghoul, as Sid would say.", "tr": "就像Sid说的，一只叽里咕噜的食尸鬼。", "spk": "S1"}, {"s": 2422.83, "e": 2429.17, "en": "Exactly. But with Koen, the main character, it's during the day he is fully normally human,", "tr": "没错。但主角Koen呢，白天他完全是个正常人，", "spk": "S1"}, {"s": 2429.43, "e": 2431.61, "en": "can only fight with a sword, his fists, and what have you.", "tr": "只能用剑、拳头之类的打。", "spk": "S1"}, {"s": 2431.85, "e": 2434.25, "en": "But then by night, he becomes fully vampire.", "tr": "但一到晚上，他就完全变成吸血鬼了。", "spk": "S1"}, {"s": 2434.49, "e": 2437.85, "en": "His hands are like these really long claws.", "tr": "他的手会变成那种特别长的爪子。", "spk": "S1"}, {"s": 2438.37, "e": 2442.31, "en": "And as you upgrade your abilities, you could make it that those claws are stronger than even...", "tr": "而且随着你升级能力，你可以让那些爪子变得比……甚至比……还强。", "spk": "S1"}, {"s": 2442.31, "e": 2445.07, "en": "There's like a legendary... There's a bunch of swords in the game you can find,", "tr": "游戏里有一把……有好多剑可以找到，", "spk": "S1"}, {"s": 2445.13, "e": 2448.13, "en": "but there's one that's like the sword from the key art and everything.", "tr": "但有一把就是主视觉图里那把剑之类的。", "spk": "S1"}, {"s": 2448.67, "e": 2451.07, "en": "That is a very powerful sword from my first playthrough.", "tr": "那是我第一周目时一把非常强力的剑。", "spk": "S1"}, {"s": 2451.19, "e": 2452.29, "en": "I was very dependent on it.", "tr": "我当时特别依赖它。", "spk": "S1"}, {"s": 2452.69, "e": 2460.13, "en": "In the second playthrough, because I have been guzzling blood, essentially, I've made my claws so powerful that at night I am...", "tr": "第二周目的时候，因为我基本上一直在狂喝血，我把爪子弄得特别强，晚上我就是……", "spk": "S1"}, {"s": 2460.71, "e": 2463.47, "en": "Like you're choosing to play by night.", "tr": "就像你是主动选择晚上玩。", "spk": "S1"}, {"s": 2463.61, "e": 2466.29, "en": "Yes. I'm trying to play by night as much as I can.", "tr": "对。我尽量能晚上玩就晚上玩。", "spk": "S1"}, {"s": 2466.33, "e": 2471.99, "en": "I still try to take advantage of the daytime for certain quests, but especially now that I know what are the more human-focused ones,", "tr": "我还是会利用白天做一些特定的任务，但尤其是现在我知道哪些是更偏人类的任务了，", "spk": "S1"}, {"s": 2472.21, "e": 2473.67, "en": "I'm like, well, I'm not aligning", "tr": "我就想，好吧，这次我不站", "spk": "S1"}, {"s": 2473.67, "e": 2475.57, "en": "myself with them this time, so I don't need to do that.", "tr": "他们那边了，所以我不需要做那些。", "spk": "S1"}, {"s": 2475.57, "e": 2481.07, "en": "Is your skill... Are the skill trees and options the same, dependent on how you play?", "tr": "你的技能……技能树和选项是一样的吗，取决于你怎么玩？", "spk": "S0"}, {"s": 2481.29, "e": 2482.51, "en": "It's just a matter of like...", "tr": "就是那种……", "spk": "S0"}, {"s": 2482.51, "e": 2484.33, "en": "So there are three different skill trees, actually.", "tr": "其实有三个不同的技能树。", "spk": "S1"}, {"s": 2484.47, "e": 2490.17, "en": "There is a... Because at the very beginning of the game, someone from your village happens to know witchcraft,", "tr": "有一个……因为游戏一开始，你们村里有个人刚好懂巫术，", "spk": "S1"}, {"s": 2490.17, "e": 2491.65, "en": "and so she teaches you hexes.", "tr": "然后她就教你咒术。", "spk": "S1"}, {"s": 2491.77, "e": 2494.19, "en": "So there is like a witch-hex skill tree,", "tr": "所以有一个女巫咒术技能树，", "spk": "S1"}, {"s": 2494.21, "e": 2502.39, "en": "which you can only use during the daytime because it's dependent on you cutting runes into your skin and using the blood for magic.", "tr": "只能在白天用，因为它需要你把符文刻进皮肤里，用血来施法。", "spk": "S1"}, {"s": 2502.39, "e": 2504.57, "en": "So like a warlock type thing, yeah.", "tr": "就像术士那种，对。", "spk": "S1"}, {"s": 2504.69, "e": 2508.97, "en": "But when you're a vampire, you heal too quickly, so the runes don't have time to...", "tr": "但你是吸血鬼的时候，回血太快了，符文来不及……", "spk": "S1"}, {"s": 2508.97, "e": 2513.79, "en": "Oh, fascinating. Yeah. So it's... You can only use magic in the day, you can only use your vampire abilities at night,", "tr": "哦，有意思。对。所以就是……你只能在白天用魔法，只能在晚上用吸血鬼能力，", "spk": "S1"}, {"s": 2513.83, "e": 2515.97, "en": "and then the sword skill tree you can use either way.", "tr": "然后剑术技能树两种时候都能用。", "spk": "S1"}, {"s": 2516.15, "e": 2518.07, "en": "That's so clever. So it kind of has like a...", "tr": "太聪明了。所以它有点像……", "spk": "S1"}, {"s": 2518.07, "e": 2519.45, "en": "Do you want to focus on your day abilities?", "tr": "你想专注白天的能力？", "spk": "S1"}, {"s": 2519.47, "e": 2520.65, "en": "Do you want to focus on your night abilities?", "tr": "还是想专注晚上的能力？", "spk": "S1"}, {"s": 2520.77, "e": 2522.67, "en": "And then the sword mastery is kind of you're in the middle.", "tr": "然后剑术精通就有点像你在中间。", "spk": "S1"}, {"s": 2522.67, "e": 2522.99, "en": "So", "tr": "所以", "spk": "S1"}, {"s": 2522.99, "e": 2530.45, "en": "my other question is, you know, the time mechanic, is a playthrough like kind of reliable in terms of how a playthrough goes?", "tr": "我另一个问题是，你知道，时间机制，一周目的流程算是比较稳定可预测的吗？", "spk": "S0"}, {"s": 2530.61, "e": 2531.75, "en": "Assuming that you use all the days.", "tr": "假设你把所有白天都用上。", "spk": "S0"}, {"s": 2531.97, "e": 2536.17, "en": "Like, or, you know, like how does time impact your play?", "tr": "就是，或者说，你知道，时间是怎么影响你的玩法的？", "spk": "S0"}, {"s": 2536.53, "e": 2538.87, "en": "Like, is it truly day and night cycle?", "tr": "就是，真的是昼夜循环吗？", "spk": "S0"}, {"s": 2539.07, "e": 2540.25, "en": "There's like, it's always ticking.", "tr": "就是，它一直在走。", "spk": "S0"}, {"s": 2540.65, "e": 2542.07, "en": "It is always ticking. It is always ticking.", "tr": "它一直在走。它一直在走。", "spk": "S1"}, {"s": 2542.75, "e": 2548.93, "en": "Different quests, like the importance of a quest will take up more time, and it will give you,", "tr": "不同的任务，比如一个任务的重要性会占用更多时间，它会给你，", "spk": "S1"}, {"s": 2549.05, "e": 2550.93, "en": "there's like a marker for each thing that you do.", "tr": "你做的每件事都有个标记。", "spk": "S1"}, {"s": 2551.05, "e": 2555.89, "en": "So the smaller quests of like, I'm going to that cave and fighting a bear, and I'm going to find a note there,", "tr": "所以那些比较小的任务，比如我要去那个洞穴打一只熊，我还要在那儿找一张纸条，", "spk": "S1"}, {"s": 2556.03, "e": 2562.95, "en": "like whatever it may be, that might only be one chunk of, one day chunk, which I want to say it's like 10 or 12 little,", "tr": "不管是什么吧，那可能只占一个时间段，一天里的一个时间段，我想说大概是10个或12个小", "spk": "S1"}, {"s": 2563.57, "e": 2565.19, "en": "it's probably 12 now that I think about it.", "tr": "现在想想，应该是12个。", "spk": "S1"}, {"s": 2565.19, "e": 2566.61, "en": "That would make sense. That's the day.", "tr": "那就说得通了。那就是一天。", "spk": "S1"}, {"s": 2567.61, "e": 2573.25, "en": "But some quests, and also when you're talking to someone, they might be like, do you want to go do it right now?", "tr": "但有些任务，还有你跟别人说话的时候，他们可能会问，你想现在就去吗？", "spk": "S1"}, {"s": 2573.31, "e": 2574.47, "en": "But we have to do it at night.", "tr": "但我们得在晚上做。", "spk": "S1"}, {"s": 2574.61, "e": 2578.57, "en": "And so it would be like, I'm fast forwarding through my eight leftover chunks of the day.", "tr": "所以就会变成，我要快进掉今天剩下的八个时间段。", "spk": "S1"}, {"s": 2578.91, "e": 2579.97, "en": "Probably don't want to do that a lot.", "tr": "可能不太想经常这么干。", "spk": "S1"}, {"s": 2580.09, "e": 2582.13, "en": "So it depends on what you're doing.", "tr": "所以这取决于你在做什么。", "spk": "S1"}, {"s": 2582.35, "e": 2585.37, "en": "So for me, I know a couple times in my first playthrough, I was like, well,", "tr": "对我来说，我知道在我第一周目的时候有那么几次，我就想，好吧，", "spk": "S1"}, {"s": 2585.47, "e": 2589.81, "en": "even though I'm doing my human run, human aligned run here, I do just want to do this quest.", "tr": "虽然我在这儿走的是人类路线，人类阵营的路线，但我就是想做这个任务。", "spk": "S1"}, {"s": 2589.91, "e": 2592.27, "en": "So yeah, sure, I'll just like lose a day, I have enough time.", "tr": "所以行吧，我就浪费一天，我时间够。", "spk": "S1"}, {"s": 2592.71, "e": 2597.91, "en": "But as I got towards the end of the game, I think by I think I beat it with like 11 days,", "tr": "但当我接近游戏尾声的时候，我想我通关的时候大概还剩11天，", "spk": "S1"}, {"s": 2598.71, "e": 2601.35, "en": "like 10 or nine days left, I want to say.", "tr": "我想说，大概还剩10天或9天吧。", "spk": "S1"}, {"s": 2602.37, "e": 2603.93, "en": "And when you get towards the end,", "tr": "当你接近尾声的时候，", "spk": "S1"}, {"s": 2604.21, "e": 2610.05, "en": "it kind of warns you as well that like you've initiated a quest with an ally that when you tell them you're ready to go,", "tr": "它也会有点提醒你，比如你已经和一个盟友开启了任务，当你告诉他们你准备好了，", "spk": "S1"}, {"s": 2610.19, "e": 2612.63, "en": "they're going to go. And that will be the end.", "tr": "他们就会出发。而那就会是结局了。", "spk": "S1"}, {"s": 2613.03, "e": 2620.45, "en": "So if you have eight days left, nine days left, you can use it to try to clean up additional quests and maybe get stronger.", "tr": "所以如果你还剩八天、九天，你可以用这些时间去清理额外的任务，也许还能变强一点。", "spk": "S1"}, {"s": 2620.45, "e": 2623.87, "en": "I see. But I reached a point that I was like, No, I'm ready to go.", "tr": "我明白了。但我到了某个点，我就想，不，我准备好了。", "spk": "S1"}, {"s": 2624.43, "e": 2624.47, "en": "Yeah.", "tr": "对。", "spk": "S1"}, {"s": 2624.91, "e": 2627.69, "en": "Did they give you like a recommended level like or something?", "tr": "他们有给你什么推荐等级之类的吗？", "spk": "S0"}, {"s": 2628.51, "e": 2633.71, "en": "Not that I remember. There's like little skulls that will tell like a color coded system that tells you how tough folks are.", "tr": "我不记得有。会有那种小骷髅头，用颜色编码的系统告诉你那些人有多难打。", "spk": "S1"}, {"s": 2634.85, "e": 2637.29, "en": "Cool. But I was I definitely felt ready.", "tr": "酷。但我确实觉得自己准备好了。", "spk": "S1"}, {"s": 2637.49, "e": 2641.39, "en": "And the final fight was like, I still have like about a week left.", "tr": "最后那场战斗的时候，我还剩大概一周。", "spk": "S1"}, {"s": 2641.57, "e": 2642.73, "en": "I want a little over a week left.", "tr": "我想还剩一周多一点。", "spk": "S1"}, {"s": 2642.89, "e": 2646.95, "en": "And I probably could have gotten like a hair stronger to make it a bit of an easier fight.", "tr": "我本来也许还能再强那么一丁点，让那场战斗稍微轻松一点。", "spk": "S1"}, {"s": 2647.07, "e": 2648.15, "en": "But I enjoyed the challenge. Yeah,", "tr": "但我挺享受那个挑战的。对，", "spk": "S1"}, {"s": 2648.25, "e": 2651.79, "en": "sometimes it's nice to have that just right, you know, level of power.", "tr": "有时候刚刚好的那种强度就挺好的，你懂的。", "spk": "S0"}, {"s": 2652.47, "e": 2655.57, "en": "Last question. So how long was your first playthrough if you had to guess roughly?", "tr": "最后一个问题。那你第一周目大概花了多长时间，如果让你粗略猜的话？", "spk": "S0"}, {"s": 2655.85, "e": 2657.67, "en": "My first one was maybe...", "tr": "我第一周目大概是……", "spk": "S9"}, {"s": 2658.45, "e": 2661.53, "en": "Like 16-ish hours? Maybe 20?", "tr": "16个小时左右？也许20个？", "spk": "S9"}, {"s": 2661.69, "e": 2661.81, "en": "So", "tr": "所以", "spk": "S9"}, {"s": 2661.81, "e": 2663.83, "en": "that's why I think... That's really cool, because you could have...", "tr": "这就是为什么我觉得……那真的很酷，因为你本来可以……", "spk": "S0"}, {"s": 2663.83, "e": 2665.83, "en": "It's a quicker thing than you would imagine.", "tr": "它比你想象的要快。", "spk": "S9"}, {"s": 2665.85, "e": 2665.97, "en": "You", "tr": "你", "spk": "S9"}, {"s": 2665.97, "e": 2671.27, "en": "could have dawdled more if you wanted to, but // tracking
var cur=-1,curCh=-1;
function find(t){var lo=0,hi=starts.length-1,r=-1;while(lo<=hi){var m=(lo+hi)>>1;if(starts[m]<=t+0.05){r=m;lo=m+1}else hi=m-1}return r}
function findCh(t){var r=0;for(var k=0;k<chaps.length;k++){if(chaps[k].s<=t+0.05)r=k;else break}return r}
var scrollAnim=null,progScroll=false,lastProg=0,lastTop=0;
function smoothTo(y,instant){y=Math.max(0,Math.min(y,L.scrollHeight-L.clientHeight));if(scrollAnim)cancelAnimationFrame(scrollAnim);
 if(instant){progScroll=true;L.scrollTop=y;lastTop=y;setTimeout(function(){progScroll=false;lastProg=Date.now()},50);return}
 var y0=L.scrollTop,d=y-y0,t0=null,D=Math.min(700,250+Math.abs(d)*0.4);if(Math.abs(d)<1)return;progScroll=true;
 function step(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/D),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;L.scrollTop=y0+d*e;
  if(p<1)scrollAnim=requestAnimationFrame(step);else{scrollAnim=null;lastTop=L.scrollTop;setTimeout(function(){progScroll=false;lastProg=Date.now()},30)}}
 scrollAnim=requestAnimationFrame(step)}
function recenter(instant){if(cur<0||!follow)return;var el=els[cur];var y=el.offsetTop-(L.clientHeight-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ph'))||240))*0.45+el.offsetHeight/2;smoothTo(y,instant)}

function setCur(i,instant){if(i===cur)return;var old=cur;cur=i;if(old>=0&&els[old])els[old].classList.remove('active');
 var a=Math.min(old,i),b=Math.max(old,i);if(old<0){a=0;b=els.length-1}
 for(var k=Math.max(0,a);k<=Math.min(els.length-1,b);k++)els[k].classList.toggle('past',k<i);
 if(i>=0){els[i].classList.add('active');updLine();recenter(instant)}}
function setCh(k){if(k===curCh)return;var old=curCh;curCh=k;

  var no=cis[j].firstChild;no.innerHTML=j===k?'<span class="eq"><i></i><i></i><i></i></span>':(j+1)}

 var c=chaps[k];$('chapTitle').innerHTML=esc(c.tr)+'<small>'+esc(c.en)+'</small>';$('chapIdx').textContent=(k+1)+'/'+chaps.length;
 if('mediaSession' in navigator&&window.MediaMetadata){try{navigator.mediaSession.metadata=new MediaMetadata({title:c.tr+' · '+c.en,artist:CFG.show,album:CFG.epTitle,artwork:[{src:document.querySelector('#meta img').src,sizes:'180x180',type:'image/jpeg'}]})}catch(e){}}}

// user scroll
function userScroll(){if(scrollAnim){cancelAnimationFrame(scrollAnim);scrollAnim=null;progScroll=false}if(follow){follow=false;applyPrefs()}$('back').classList.add('show')}
L.addEventListener('touchmove',userScroll,{passive:true});L.addEventListener('wheel',userScroll,{passive:true});
L.addEventListener('scroll',function(){if(progScroll){lastProg=Date.now();lastTop=L.scrollTop;return}if(Date.now()-lastProg>400&&Math.abs(L.scrollTop-lastTop)>40)userScroll()});
$('back').onclick=function(){setFollow(true);$('back').classList.remove('show')};
L.addEventListener('click',function(e){var h=e.target.closest&&e.target.closest('.chap-h');if(h){goCh(+h.dataset.ch);return}

  var s=b64el.textContent,CH=524288,pos=0,parts=[],n=s.length;
  (function step(){var end=Math.min(n,pos+CH);var chunk=s.substring(pos,end).replace(/[^A-Za-z0-9+\/=]/g,'');
