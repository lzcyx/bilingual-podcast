#shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,12,28,.55) 0%,rgba(8,12,28,.25) 35%,rgba(8,12,28,.45) 70%,rgba(5,8,18,.92) 100%)}
#top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
#top .t{flex:1;min-width:0}
#top .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .t span{display:block;font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:rgba(255,255,255,.9);color:var(--c-base)}
#menu{position:fixed;z-index:30;right:12px;top:calc(var(--safe-t) + 54px);background:rgba(20,24,40,.95);border-radius:14px;padding:8px;display:none;min-width:240px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#menu.show{display:block}
#menu .row{display:flex;align-items:center;justify-content:space-between;padding:9px 8px;font-size:14px;gap:12px}
#menu .seg{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:2px}
#menu .seg button{border:0;background:transparent;color:#fff;padding:5px 10px;border-radius:7px;font-size:13px;cursor:pointer}
#menu .seg button.on{background:rgba(255,255,255,.9);color:var(--c-base);font-weight:700}
#lyrics{position:fixed;inset:0;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
 padding:42vh 22px calc(50vh + var(--safe-b)) 22px;
 -webkit-mask-image:linear-gradient(180deg,transparent 0,transparent calc(var(--safe-t) + 52px),#000 calc(var(--safe-t) + 120px),#000 calc(100% - var(--ph,240px) - 50px),transparent calc(100% - var(--ph,240px) + 10px));
 mask-image:linear-gradient(180deg,transparent 0,transparent calc(var(--safe-t) + 52px),#000 calc(var(--safe-t) + 120px),#000 calc(100% - var(--ph,240px) - 50px),transparent calc(100% - var(--ph,240px) + 10px))}
#lyrics::-webkit-scrollbar{display:none}
.cue{padding:9px 6px;margin:2px 0;border-radius:12px;cursor:pointer;opacity:.34;transform-origin:left center;transition:opacity .35s ease,transform .35s ease}
.cue:active{background:rgba(255,255,255,.08)}
.cue .ts{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums;letter-spacing:.3px;margin-bottom:3px;font-weight:600;display:flex;align-items:center;gap:8px}
.cue .en{font-size:21px;line-height:1.3;font-weight:750;letter-spacing:-.2px}
.cue .zh{font-size:18px;line-height:1.45;font-weight:500;margin-top:4px;opacity:.9}
.cue.past{opacity:.28}
.cue.active{opacity:1;transform:scale(1.04)}
.cue.active .ts{opacity:1}.cue.active .ts .tm{color:var(--accent)}
.chap-h{margin:26px 6px 8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.chap-h .n{font-size:11px;font-weight:800;opacity:.6;letter-spacing:.5px;white-space:nowrap}
.chap-h .z{font-size:15px;font-weight:800}.chap-h .e{font-size:12px;opacity:.6}
body.swap .cue{display:flex;flex-direction:column}
body.swap .cue .zh{order:1;margin-top:0;font-size:21px;font-weight:700;opacity:1}
body.swap .cue .en{order:2;margin-top:4px;font-size:17px;font-weight:600;opacity:.85}
body.m-en .cue .zh{display:none}
body.m-zh .cue .en{display:none}
body.m-zh .cue .zh{font-size:22px;font-weight:700;margin-top:0;opacity:1}
body.big .cue .en{font-size:25px} body.big .cue .zh{font-size:21px}
#back{position:fixed;z-index:6;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--ph,240px) + 14px);opacity:0;pointer-events:none;transition:all .25s ease;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:var(--c-base);font-weight:700;font-size:14px;padding:10px 16px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.45);cursor:pointer}
#back.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:4px 18px calc(10px + var(--safe-b));background:rgba(12,16,30,.74);border-top:1px solid rgba(255,255,255,.08)}
#handle{display:flex;justify-content:center;align-items:center;height:18px;margin:0 auto 2px;width:90px;border:0;background:transparent;cursor:pointer;padding:0}
#handle span{display:block;width:38px;height:5px;border-radius:5px;background:rgba(255,255,255,.35);transition:all .2s}
body.strip-off #handle span{width:22px;height:10px;background:transparent;border:solid rgba(255,255,255,.6);border-width:2.5px 2.5px 0 0;border-radius:2px;transform:rotate(-45deg) translate(-2px,3px)}
#meta{display:flex;align-items:center;gap:12px;overflow:hidden;max-height:70px;transition:max-height .28s ease,opacity .2s ease,margin .28s ease;margin-bottom:8px}
body.strip-off #meta{max-height:0;opacity:0;margin-bottom:0}
#meta img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
#meta .mt{flex:1;min-width:0}
#meta .mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta .mt span{display:block;font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hideStrip{border:0;background:rgba(255,255,255,.12);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none;font-size:15px;line-height:30px;padding:0}
#chapRow{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#fff;width:100%;padding:2px 0;cursor:pointer;text-align:left}
#chapRow .ic{flex:none;width:18px;height:18px;opacity:.85}
#chapRow .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:750}
#chapRow .tx small{font-weight:500;opacity:.6;font-size:12px;margin-left:6px}
#chapRow .ix{flex:none;font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
#bar{margin:8px 0 2px;position:relative;height:22px;touch-action:none;cursor:pointer}
#segs{position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;display:flex;gap:3px}
.sg{height:100%;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;min-width:2px;transition:height .15s,transform .15s}
.sg .sf{height:100%;width:0;background:#fff}
.sg.cur{transform:scaleY(1.35)}
#bar.drag .sg{transform:scaleY(1.6)}
#knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;left:0;box-shadow:0 1px 6px rgba(0,0,0,.4);transition:transform .15s;pointer-events:none}
#bar.drag #knob{transform:scale(1.35)}
#tip{position:absolute;bottom:26px;left:0;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--c-base);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:78vw;overflow:hidden;text-overflow:ellipsis}
#tip small{display:block;font-weight:600;opacity:.6;font-variant-numeric:tabular-nums}
#bar.drag #tip{opacity:1}
#times{display:flex;justify-content:space-between;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
#ctl{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
#ctl button{border:0;background:transparent;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center;min-width:40px}
#ctl svg{width:28px;height:28px;fill:#fff}
#ctl .ch svg{width:24px;height:24px}
#play svg{width:50px;height:50px}
#speed{font-weight:800;font-size:13px;border:1.5px solid rgba(255,255,255,.55)!important;border-radius:8px;padding:3px 5px!important;min-width:44px!important}
#follow{flex-direction:column;font-size:10px;font-weight:700;gap:1px}
#follow svg{width:20px;height:20px}
#follow.off{opacity:.4}
#status{font-size:11px;opacity:.75;text-align:center;margin-top:2px;display:none}
#status.show{display:block}
#sheetBg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78vh;display:flex;flex-direction:column;background:rgba(22,26,44,.97);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
body.sheet-open #sheetBg{opacity:1;pointer-events:auto}
body.sheet-open #sheet{transform:translateY(0)}
#sheet .hd{display:flex;align-items:center;padding:8px 18px 10px;gap:10px}
#sheet .grab{width:38px;height:5px;border-radius:5px;background:rgba(255,255,255,.3);margin:8px auto 2px}
#sheet .hd b{font-size:17px;flex:1}
#sheet .hd span{font-size:12px;opacity:.6}
#sheet .x{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}
#clist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 14px}
.ci{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:12px;cursor:pointer}
.ci:active{background:rgba(255,255,255,.06)}
.ci .no{width:22px;flex:none;text-align:center;font-size:13px;font-weight:800;opacity:.5;font-variant-numeric:tabular-nums}
.ci .bd{flex:1;min-width:0}
.ci .z{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .e{font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ci .tm{flex:none;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;opacity:.75;line-height:1.35}
.ci .tm small{display:block;opacity:.65;font-size:11px}
.ci.cur{background:rgba(255,255,255,.1)}
.ci.cur .no{opacity:1;color:var(--accent)}
.ci.cur .z{color:var(--accent)}
.ci.done .z,.ci.done .e{opacity:.55}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
body.paused .eq i{animation:none;height:5px}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
@media (min-width:760px){#lyrics{padding-left:max(22px,calc(50vw - 360px));padding-right:max(22px,calc(50vw - 360px))}#player{padding-left:max(18px,calc(50vw - 380px));padding-right:max(18px,calc(50vw - 380px))}#sheet{left:calc(50vw - 380px);right:calc(50vw - 380px)}}

/* Dual style (S = Spotify, B = Apple), switched live via body.theme-S / body.theme-B. Theme rules use :where() so
   their specificity equals the base rules they override (same cascade as the old separate templates). Colours
   are injected by build.py. */
body.theme-S{
  --c-base:#2d6a9a;--c-top:#3281bd;--accent:#fff;
  background:var(--c-base);color:#fff;
}
:where(body.theme-S) #shade{background:linear-gradient(180deg,var(--c-top) 0%,var(--c-base) 17%,var(--c-base) 100%)}

:where(body.theme-S) .sg .sf{background:#fff}
:where(body.theme-S) #knob{box-shadow:none}

:where(body.theme-S) #sheet .x{background:#3e3e3e}
